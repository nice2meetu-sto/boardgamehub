<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#534AB7" />
<title>보드게임 Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet" />
<style>
  :root {
    --main: #534AB7;
    --main-dark: #3f379a;
    --main-light: #ece9fb;
    --bg: #f5f5f8;
    --card: #ffffff;
    --text: #1b1b21;
    --text-sub: #6b6b78;
    --border: #eaeaef;
    --win: #f4b740;
    --danger: #e2564d;
    --ok: #2fa96b;
    --radius: 16px;
    --tabbar-h: 62px;
    --maxw: 480px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #dcdce3;
    color: var(--text);
    font-size: 15px;
    line-height: 1.45;
  }
  #app {
    max-width: var(--maxw);
    margin: 0 auto;
    min-height: 100vh;
    background: var(--bg);
    position: relative;
    box-shadow: 0 0 40px rgba(0,0,0,.08);
    display: flex;
    flex-direction: column;
  }
  button { font-family: inherit; cursor: pointer; border: none; background: none; }
  input, select, textarea { font-family: inherit; font-size: 15px; }
  a { color: var(--main); }

  /* ===== Header ===== */
  .appbar {
    position: sticky; top: 0; z-index: 40;
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 14px 18px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px;
  }
  .appbar h1 { font-size: 18px; font-weight: 900; margin: 0; letter-spacing: -.02em; }
  .appbar h1 .dice { color: var(--main); }
  .appbar .who { font-size: 12px; color: var(--text-sub); }
  .appbar .who b { color: var(--main); }

  /* ===== Content ===== */
  .view { flex: 1; padding: 16px 16px calc(var(--tabbar-h) + 84px); display: none; }
  .view.active { display: block; }

  /* ===== Cards / common ===== */
  .card {
    background: var(--card);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    padding: 14px;
    margin-bottom: 12px;
  }
  .section-title { font-size: 13px; font-weight: 700; color: var(--text-sub); margin: 4px 2px 10px; }

  /* summary blocks */
  .summary-row { display: flex; gap: 10px; margin-bottom: 14px; }
  .stat {
    flex: 1; background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 14px 10px; text-align: center;
  }
  .stat .num { font-size: 22px; font-weight: 900; color: var(--main); }
  .stat .lbl { font-size: 11px; color: var(--text-sub); margin-top: 3px; }
  .stat.hero { background: var(--main); border-color: var(--main); }
  .stat.hero .num, .stat.hero .lbl { color: #fff; }

  /* pills / badges */
  .badge {
    display: inline-block; font-size: 11px; font-weight: 700; padding: 3px 8px;
    border-radius: 999px; background: var(--main-light); color: var(--main);
  }
  .chip {
    display: inline-flex; align-items: center; white-space: nowrap;
    font-size: 13px; padding: 7px 14px; border-radius: 999px;
    background: var(--card); border: 1px solid var(--border); color: var(--text-sub);
    font-weight: 500;
  }
  .chip.on { background: var(--main); color: #fff; border-color: var(--main); }
  .chip-row { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 8px; -webkit-overflow-scrolling: touch; }
  .chip-row::-webkit-scrollbar { display: none; }

  /* inputs */
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12px; font-weight: 700; color: var(--text-sub); margin-bottom: 6px; }
  .input, select.input, textarea.input {
    width: 100%; padding: 12px 14px; border: 1px solid var(--border);
    border-radius: 12px; background: #fafafc; color: var(--text); outline: none;
  }
  .input:focus { border-color: var(--main); background: #fff; }
  textarea.input { resize: vertical; min-height: 72px; }
  .btn {
    width: 100%; padding: 14px; border-radius: 12px; background: var(--main);
    color: #fff; font-weight: 700; font-size: 15px;
  }
  .btn:active { background: var(--main-dark); }
  .btn.ghost { background: var(--main-light); color: var(--main); }
  .btn.sm { width: auto; padding: 9px 16px; font-size: 13px; }
  .btn:disabled { opacity: .5; }
  .btn.danger { background: var(--danger); }

  /* search box */
  .searchbox {
    display: flex; align-items: center; gap: 8px; background: var(--card);
    border: 1px solid var(--border); border-radius: 12px; padding: 10px 14px; margin-bottom: 12px;
  }
  .searchbox input { border: none; background: none; outline: none; width: 100%; }

  /* ===== Play session card ===== */
  .session {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px; margin-bottom: 12px;
  }
  .session-head { display: flex; gap: 12px; align-items: center; margin-bottom: 10px; }
  /* thumbnail wrapper: shows 🎲 placeholder behind the image; if the image
     fails to load (e.g. BGG hotlink block) the placeholder stays visible */
  .thumb {
    position: relative; flex-shrink: 0; overflow: hidden;
    background: var(--main-light);
    display: flex; align-items: center; justify-content: center;
  }
  .thumb::after { content: '🎲'; font-size: 22px; }
  .thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .session-thumb {
    width: 46px; height: 46px; border-radius: 12px;
  }
  .session-head .g-name { font-weight: 700; font-size: 15px; }
  .session-head .g-meta { font-size: 12px; color: var(--text-sub); margin-top: 2px; }
  .participants { display: flex; flex-direction: column; gap: 6px; }
  .prow {
    display: flex; align-items: center; justify-content: space-between;
    padding: 7px 10px; border-radius: 10px; background: #fafafc;
  }
  .prow.win { background: #fff8e8; }
  .prow .pname { font-weight: 500; font-size: 14px; }
  .prow .pscore { font-size: 13px; color: var(--text-sub); font-weight: 700; }
  .crown { margin-left: 4px; }

  /* ===== Game card ===== */
  .gcard {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 12px; margin-bottom: 12px; overflow: hidden;
  }
  .gcard-top { display: flex; gap: 12px; }
  .gcard-img {
    width: 68px; height: 68px; border-radius: 12px;
  }
  .gcard-body { flex: 1; min-width: 0; }
  .gcard-name { font-weight: 700; font-size: 15px; letter-spacing: -.01em; }
  .gcard-en { font-size: 11px; color: var(--text-sub); margin-top: 1px; }
  .gcard-meta { font-size: 12px; color: var(--text-sub); margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px 10px; }
  .gcard-ratings { display: flex; gap: 14px; margin-top: 8px; align-items: center; }
  .rate-club { font-weight: 900; font-size: 16px; color: var(--main); }
  .rate-club .star { color: var(--win); }
  .rate-club small { font-size: 11px; color: var(--text-sub); font-weight: 500; }
  .rate-bgg { font-size: 12px; color: var(--text-sub); }
  .gcard-detail { display: none; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); font-size: 13px; color: #444; white-space: pre-wrap; }
  .gcard.open .gcard-detail { display: block; }

  /* rating editor (MY 게임기록) */
  .rate-edit { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--border); }
  .stars { display: flex; gap: 1px; font-size: 22px; user-select: none; }
  .stars .s { color: #dcdce3; cursor: pointer; line-height: 1; }
  .stars .s.filled { color: var(--win); }
  .stars .s.half { position: relative; color: #dcdce3; }
  .stars .s.half::before { content: '★'; position: absolute; left: 0; width: 50%; overflow: hidden; color: var(--win); }
  .rate-val { font-size: 13px; color: var(--text-sub); margin: 6px 0; font-weight: 700; }

  /* monthly mini chart */
  .barchart { display: flex; align-items: flex-end; gap: 8px; height: 90px; padding: 4px 2px 0; }
  .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; justify-content: flex-end; }
  .bar {
    width: 60%; max-width: 26px; background: var(--main); border-radius: 6px 6px 0 0; min-height: 3px;
    transition: height .3s;
  }
  .bar-col .bc { font-size: 10px; color: var(--text-sub); }
  .bar-col .bm { font-size: 10px; color: var(--text-sub); }

  /* game-stat list rows (MY 플레이) */
  .grow {
    display: flex; align-items: center; gap: 12px; padding: 11px 4px; border-bottom: 1px solid var(--border);
  }
  .grow:last-child { border-bottom: none; }
  .grow-rank { width: 22px; text-align: center; font-weight: 900; color: var(--text-sub); font-size: 13px; }
  .grow-body { flex: 1; min-width: 0; }
  .grow-name { font-weight: 700; font-size: 14px; }
  .grow-sub { font-size: 12px; color: var(--text-sub); }
  .grow-rate { text-align: right; }
  .grow-rate .r { font-weight: 900; color: var(--main); font-size: 16px; }
  .grow-rate .rl { font-size: 10px; color: var(--text-sub); }
  .winbar { height: 5px; background: var(--border); border-radius: 3px; margin-top: 5px; overflow: hidden; }
  .winbar > i { display: block; height: 100%; background: var(--main); border-radius: 3px; }

  /* ===== Bottom tabbar ===== */
  .tabbar {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: var(--maxw); height: var(--tabbar-h);
    background: var(--card); border-top: 1px solid var(--border);
    display: flex; z-index: 50;
    padding-bottom: env(safe-area-inset-bottom, 0);
  }
  .tab {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 3px; color: var(--text-sub); font-size: 11px; font-weight: 500;
  }
  .tab .ico { font-size: 20px; line-height: 1; }
  .tab.on { color: var(--main); font-weight: 700; }
  .fab {
    position: fixed; bottom: calc(var(--tabbar-h) + 16px + env(safe-area-inset-bottom, 0)); z-index: 55;
    left: 50%; margin-left: calc(var(--maxw) / 2 - 74px);
    width: 56px; height: 56px; border-radius: 50%; background: var(--main); color: #fff;
    font-size: 30px; font-weight: 300; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 18px rgba(83,74,183,.45);
  }
  @media (max-width: 480px) { .fab { left: auto; right: 18px; margin-left: 0; } }
  .fab:active { background: var(--main-dark); }

  /* ===== Modal / sheet ===== */
  .overlay {
    position: fixed; inset: 0; background: rgba(20,20,30,.45); z-index: 100;
    display: none; align-items: flex-end; justify-content: center;
  }
  .overlay.show { display: flex; }
  .sheet {
    width: 100%; max-width: var(--maxw); background: var(--bg);
    border-radius: 22px 22px 0 0; max-height: 92vh; overflow-y: auto;
    padding: 8px 16px calc(24px + env(safe-area-inset-bottom, 0));
    animation: slideup .25s ease;
  }
  @keyframes slideup { from { transform: translateY(30px); opacity: .6; } to { transform: translateY(0); opacity: 1; } }
  .sheet-grip { width: 40px; height: 4px; background: #d3d3dc; border-radius: 3px; margin: 8px auto 12px; }
  .sheet h2 { font-size: 18px; margin: 4px 2px 16px; font-weight: 900; }
  .sheet-tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .sheet-tabs button {
    flex: 1; padding: 10px; border-radius: 10px; background: var(--card);
    border: 1px solid var(--border); font-weight: 700; font-size: 14px; color: var(--text-sub);
  }
  .sheet-tabs button.on { background: var(--main); color: #fff; border-color: var(--main); }

  /* bgg candidate list */
  .cand { padding: 12px; border: 1px solid var(--border); border-radius: 12px; background: var(--card); margin-bottom: 8px; }
  .cand.on { border-color: var(--main); background: var(--main-light); }
  .cand .cn { font-weight: 700; font-size: 14px; }
  .cand .cy { font-size: 12px; color: var(--text-sub); }

  /* participant rows in addPlay */
  .ppart { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  .ppart select { flex: 2; }
  .ppart input { flex: 1; min-width: 0; }
  .wintoggle {
    flex-shrink: 0; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border);
    background: #fafafc; font-weight: 700; font-size: 13px; color: var(--text-sub);
  }
  .wintoggle.on { background: var(--win); color: #fff; border-color: var(--win); }
  .rm-btn { flex-shrink: 0; color: var(--danger); font-size: 20px; padding: 4px 8px; }

  /* ===== Toast / loader ===== */
  #toast {
    position: fixed; left: 50%; bottom: calc(var(--tabbar-h) + 30px); transform: translateX(-50%);
    background: #22222c; color: #fff; padding: 12px 20px; border-radius: 12px; font-size: 14px;
    z-index: 200; opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none;
    max-width: 88%; text-align: center; box-shadow: 0 6px 20px rgba(0,0,0,.25);
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(-6px); }
  #toast.err { background: var(--danger); }
  #loader {
    position: fixed; inset: 0; background: rgba(245,245,248,.7); z-index: 300;
    display: none; align-items: center; justify-content: center; flex-direction: column; gap: 12px;
  }
  #loader.show { display: flex; }
  .spinner {
    width: 40px; height: 40px; border: 4px solid var(--main-light); border-top-color: var(--main);
    border-radius: 50%; animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loader .ltxt { font-size: 13px; color: var(--text-sub); }

  .empty { text-align: center; color: var(--text-sub); padding: 40px 20px; font-size: 14px; }
  .empty .big { font-size: 34px; margin-bottom: 8px; }
  .muted { color: var(--text-sub); }
  .hint { font-size: 12px; color: var(--text-sub); margin-top: 4px; }
  .center-login { padding: 30px 8px; }
  .center-login .lg-ico { text-align: center; font-size: 46px; margin-bottom: 6px; }
  .center-login h2 { text-align: center; font-size: 20px; margin: 0 0 24px; }
  .subtabs { display: flex; gap: 6px; background: var(--main-light); padding: 4px; border-radius: 12px; margin-bottom: 14px; }
  .subtabs button { flex: 1; padding: 9px; border-radius: 9px; font-weight: 700; font-size: 13px; color: var(--main); }
  .subtabs button.on { background: var(--card); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .row2 { display: flex; gap: 10px; }
  .row2 > * { flex: 1; }
  .logout-link { font-size: 12px; color: var(--danger); text-decoration: underline; background: none; }
</style>
</head>
<body>
<div id="app">
  <div class="appbar">
    <h1><span class="dice">🎲</span> 보드게임 Hub <span id="build-tag" style="font-size:10px;font-weight:500;color:var(--text-sub);vertical-align:middle;">v0104</span></h1>
    <div style="display:flex;align-items:center;gap:10px;">
      <button onclick="refreshAll()" title="최신 데이터로 업데이트"
              style="background:var(--main-light);color:var(--main);border-radius:999px;padding:5px 10px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;">🔄 업데이트</button>
      <div class="who" id="whoami">비로그인</div>
    </div>
  </div>

  <!-- ===== VIEW: 플레이 ===== -->
  <div class="view active" id="view-play">
    <div class="summary-row" id="play-summary"></div>
    <div id="play-catchart"></div>
    <div class="section-title" id="play-list-title">게임별 플레이 횟수</div>
    <div id="play-list"></div>
  </div>

  <!-- ===== VIEW: 게임 ===== -->
  <div class="view" id="view-games">
    <div class="searchbox">
      <span>🔍</span>
      <input id="game-search" placeholder="게임 이름 검색 (한글/영문)" />
    </div>
    <div class="chip-row" id="cat-filter"></div>
    <div class="chip-row" id="player-filter"></div>
    <div class="chip-row" id="weight-filter"></div>
    <div id="games-list"></div>
  </div>

  <!-- ===== VIEW: MY ===== -->
  <div class="view" id="view-my">
    <div id="my-login" style="display:none;"></div>
    <div id="my-content" style="display:none;">
      <div class="subtabs">
        <button id="mytab-overview" class="on" onclick="switchMyTab('overview')">전체 기록</button>
        <button id="mytab-plays" onclick="switchMyTab('plays')">플레이 기록</button>
        <button id="mytab-games" onclick="switchMyTab('games')">게임 기록</button>
      </div>
      <div id="my-overview"></div>
      <div id="my-plays" style="display:none;"></div>
      <div id="my-games" style="display:none;"></div>
      <div style="text-align:center;margin:20px 0 4px;">
        <button class="logout-link" onclick="logout()">로그아웃</button>
      </div>
    </div>
  </div>

  <!-- FAB -->
  <button class="fab" onclick="openAddSheet()">+</button>

  <!-- Tabbar -->
  <div class="tabbar">
    <button class="tab on" id="tab-play" onclick="switchView('play')"><span class="ico">📋</span>플레이</button>
    <button class="tab" id="tab-games" onclick="switchView('games')"><span class="ico">🎯</span>게임</button>
    <button class="tab" id="tab-my" onclick="switchView('my')"><span class="ico">👤</span>MY</button>
  </div>
</div>

<!-- ===== Add Sheet (게임추가 / 플레이추가) ===== -->
<div class="overlay" id="add-overlay">
  <div class="sheet">
    <div class="sheet-grip"></div>
    <div class="sheet-tabs">
      <button id="addtab-play" class="on" onclick="switchAddTab('play')">📋 플레이 결과</button>
      <button id="addtab-game" onclick="switchAddTab('game')">🎯 게임 추가</button>
    </div>
    <div id="add-game-form"></div>
    <div id="add-play-form" style="display:none;"></div>
  </div>
</div>

<!-- ===== Generic detail sheet (게임 상세) ===== -->
<div class="overlay" id="detail-overlay">
  <div class="sheet">
    <div class="sheet-grip"></div>
    <div id="detail-body"></div>
  </div>
</div>

<div id="toast"></div>
<div id="loader"><div class="spinner"></div><div class="ltxt">불러오는 중…</div></div>

<script>
// ============================================================
//  설정: Apps Script 웹앱 배포 URL을 여기에 입력
// ============================================================
const API_URL = "https://script.google.com/macros/s/AKfycbzYTrfFRGQYXQVRwAW7Tr3U3vyrP3G0RqvQxcTbENmRpLoW2ur3PHU6JHZuptmZ49AC/exec";

// ===== 전역 상태 =====
const state = {
  user: null,          // {player_id, name, role}
  games: [],
  plays: [],
  players: [],
  gameFilter: { category: null, playerCount: null, weight: null, search: '' },
  myTab: 'overview',
  myGameSort: 'winrate',
  authMode: 'login',   // 'login' | 'signup'
};

// ===== API =====
async function api(action, params = {}) {
  const url = new URL(API_URL);
  url.searchParams.set('action', action);
  Object.keys(params).forEach(k => url.searchParams.set(k, params[k]));
  const res = await fetch(url.toString(), { method: 'GET' });
  const json = await res.json();
  if (!json.ok) throw new Error(json.error || '요청 실패');
  return json.data;
}

function showLoader(txt) {
  const l = document.getElementById('loader');
  l.querySelector('.ltxt').textContent = txt || '불러오는 중…';
  l.classList.add('show');
}
function hideLoader() { document.getElementById('loader').classList.remove('show'); }

let toastTimer;
function toast(msg, isErr) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = isErr ? 'err show' : 'show';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = ''; }, 2600);
}

// ===== 유틸 =====
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function fmtDate(d) {
  if (!d) return '';
  const s = String(d).substring(0, 10);
  const parts = s.split('-');
  if (parts.length === 3) return `${parts[1]}.${parts[2]}`;
  return s;
}
function thumb(url, cls) {
  // referrerpolicy=no-referrer: BGG 이미지 CDN의 핫링크 차단(403) 회피용.
  // 로드 실패 시 img를 제거하면 뒤의 🎲 플레이스홀더가 그대로 보임.
  const img = url
    ? `<img src="${esc(url)}" loading="lazy" referrerpolicy="no-referrer" alt="" onerror="this.remove()"/>`
    : '';
  return `<div class="thumb ${cls}">${img}</div>`;
}
function gameById(id) { return state.games.find(g => g.game_id === id); }

// ===== 네비게이션 =====
function switchView(name) {
  ['play', 'games', 'my'].forEach(v => {
    document.getElementById('view-' + v).classList.toggle('active', v === name);
    document.getElementById('tab-' + v).classList.toggle('on', v === name);
  });
  if (name === 'my') renderMy();
  if (name === 'games') renderGames();
  if (name === 'play') renderPlay();
}

// ============================================================
//  데이터 로드
// ============================================================
async function loadCore(manual) {
  showLoader(manual ? '업데이트 중…' : '데이터 불러오는 중…');
  try {
    // getCategories는 옛 백엔드엔 없을 수 있으므로 실패해도 기본값 유지
    const [games, plays, players, categories] = await Promise.all([
      api('getGames'), api('getPlays'), api('getPlayers'),
      api('getCategories').catch(() => null)
    ]);
    state.games = games;
    state.plays = plays;
    state.players = players;
    if (Array.isArray(categories) && categories.length) CATEGORIES = categories;
    // 개인 통계/평점 캐시 무효화 → 다음 렌더 시 새로 로드
    state._myStats = null;
    state._myRatings = null;
    renderPlay();
    renderGames();
    if (state.user && document.getElementById('view-my').classList.contains('active')) renderMy();
    if (manual) toast('최신 데이터로 업데이트했어요.');
  } catch (e) {
    toast('연결 실패: ' + e.message, true);
  } finally {
    hideLoader();
  }
}

// 🔄 수동 업데이트 버튼용
function refreshAll() { loadCore(true); }

// ============================================================
//  VIEW: 플레이
// ============================================================
function setPlayScope(scope) {
  state.playScope = scope;
  renderPlay();
}

function renderPlay() {
  const nowYM = new Date().toISOString().substring(0, 7);
  const scope = state.playScope || 'all';

  // game_id -> category 맵
  const catOf = {};
  state.games.forEach(g => { catOf[g.game_id] = g.category || '기타'; });

  // 게임별 + 카테고리별 플레이 횟수 집계(전체/이번 달)
  const agg = {};       // gid -> {id, name, image, all, month}
  const catAgg = {};    // category -> {all, month}
  let totalMonth = 0;
  state.plays.forEach(s => {
    const isMonth = String(s.play_date).substring(0, 7) === nowYM;
    if (isMonth) totalMonth++;
    const gid = s.game_id || s.game_name;
    if (!agg[gid]) agg[gid] = { id: s.game_id, name: s.game_name, image: s.game_image, all: 0, month: 0 };
    agg[gid].all++;
    if (isMonth) agg[gid].month++;
    const cat = catOf[s.game_id] || '기타';
    if (!catAgg[cat]) catAgg[cat] = { all: 0, month: 0 };
    catAgg[cat].all++;
    if (isMonth) catAgg[cat].month++;
  });
  const totalAll = state.plays.length;

  // 최다 플레이 = 누적 '건수' 최다 게임
  let topGame = '-', topN = 0, topId = '';
  Object.keys(agg).forEach(gid => { if (agg[gid].all > topN) { topN = agg[gid].all; topGame = agg[gid].name; topId = agg[gid].id; } });
  const topClick = topId ? `style="cursor:pointer;" onclick="showGameInfo('${topId}')"` : '';

  // 1) 누적 카드를 맨 왼쪽에
  document.getElementById('play-summary').innerHTML = `
    <div class="stat ${scope === 'all' ? 'hero' : ''}" style="cursor:pointer;" onclick="setPlayScope('all')">
      <div class="num">${totalAll}</div><div class="lbl">누적 플레이</div></div>
    <div class="stat ${scope === 'month' ? 'hero' : ''}" style="cursor:pointer;" onclick="setPlayScope('month')">
      <div class="num">${totalMonth}</div><div class="lbl">이번 달 플레이</div></div>
    <div class="stat" ${topClick}><div class="num" style="font-size:14px;padding-top:6px;">${esc(topGame)}</div><div class="lbl">최다 플레이</div></div>`;

  // 3) 카테고리별 플레이 횟수 세로 막대그래프(선택 범위 반영)
  const catList = Object.keys(catAgg)
    .map(c => ({ cat: c, count: scope === 'month' ? catAgg[c].month : catAgg[c].all }))
    .filter(c => c.count > 0)
    .sort((a, b) => b.count - a.count);
  const catEl = document.getElementById('play-catchart');
  if (catList.length) {
    const maxCat = Math.max(...catList.map(c => c.count));
    catEl.innerHTML = `<div class="card">
      <div class="section-title" style="margin-top:0;">카테고리별 플레이 횟수 ${scope === 'month' ? '(이번 달)' : '(누적)'}</div>
      <div class="barchart">${catList.map(c => {
        const h = Math.max(4, Math.round(c.count / maxCat * 74));
        return `<div class="bar-col">
          <div class="bc">${c.count}</div>
          <div class="bar" style="height:${h}px;"></div>
          <div class="bm">${esc(c.cat)}</div>
        </div>`;
      }).join('')}</div>
    </div>`;
  } else {
    catEl.innerHTML = '';
  }

  document.getElementById('play-list-title').textContent =
    scope === 'month' ? '이번 달 게임별 플레이 횟수' : '게임별 플레이 횟수';

  // 게임별 순위(선택 범위 기준, 횟수 내림차순). 평점은 매 렌더 시 state.games에서 조회 → 새 게임에도 자동 반영
  const list = Object.keys(agg)
    .map(gid => {
      const gm = gameById(agg[gid].id) || {};
      return {
        id: agg[gid].id, name: agg[gid].name, image: agg[gid].image,
        count: scope === 'month' ? agg[gid].month : agg[gid].all,
        club_rating: gm.club_rating, rating_count: gm.rating_count
      };
    })
    .filter(g => g.count > 0)
    .sort((a, b) => b.count - a.count || String(a.name).localeCompare(String(b.name)));

  const el = document.getElementById('play-list');
  if (!list.length) {
    el.innerHTML = `<div class="empty"><div class="big">🎲</div>${scope === 'month' ? '이번 달 플레이 기록이 없어요.' : '아직 플레이 기록이 없어요.'}<br/>+ 버튼으로 결과를 추가해보세요.</div>`;
    return;
  }
  el.innerHTML = list.map((g, i) => `
    <div class="session" style="display:flex;align-items:center;gap:12px;${g.id ? 'cursor:pointer;' : ''}" ${g.id ? `onclick="showGameInfo('${g.id}')"` : ''}>
      <div class="grow-rank">${i + 1}</div>
      ${thumb(g.image, 'session-thumb')}
      <div style="flex:1;min-width:0;">
        <div class="g-name" style="font-weight:700;">${esc(g.name)}</div>
        <div class="g-meta">${g.count}판 · ${clubRatingMini(g.club_rating, g.rating_count)}</div>
      </div>
    </div>`).join('');
}

// 게임 카드처럼 컴팩트한 평점 표시(★ 8.5 (3) / 평가없음)
function clubRatingMini(rating, count) {
  return (rating != null)
    ? `<span style="color:var(--win);">★</span> <b style="color:var(--main);">${Number(rating).toFixed(1)}</b> <span class="muted">(${count || 0})</span>`
    : `<span class="muted">★ 평가없음</span>`;
}

// 게임 정보 보기(읽기 전용 시트)

  const club = g.club_rating != null
    ? `<span class="rate-club"><span class="star">★</span> ${g.club_rating.toFixed(1)}</span> <small class="muted">우리Hub평점 (평가 ${g.rating_count || 0})</small>`
    : `<span class="muted">우리Hub평점 없음</span>`;

  document.getElementById('detail-body').innerHTML = `
    <div style="display:flex;gap:12px;align-items:center;margin-bottom:12px;">
      ${thumb(g.image_url, 'gcard-img')}
      <div style="flex:1;min-width:0;">
        <div style="font-weight:800;font-size:17px;">${esc(g.name_kr || g.name_en)}
          ${g.category ? `<span class="badge" style="margin-left:6px;">${esc(g.category)}</span>` : ''}</div>
        ${g.name_en && g.name_kr ? `<div class="muted" style="font-size:12px;margin-top:2px;">${esc(g.name_en)}</div>` : ''}
      </div>
    </div>
    <div class="gcard-meta" style="margin-bottom:8px;">${meta.map(m => `<span>${m}</span>`).join('')}</div>
    <div style="margin-bottom:12px;">${club}</div>
    <div style="white-space:pre-wrap;font-size:13px;color:#444;">${g.summary_kr ? esc(g.summary_kr) : '<span class="muted">등록된 요약이 없습니다.</span>'}</div>`;

// ===== 내 플레이 기록: 수정/삭제 (입력자 본인만) =====
function refreshMySessions() {
  state._mySessions = state.plays.filter(s =>
    s.participants.some(p => p.player_id === state.user.player_id));
  filterMyPlays();
}
function startEditSession(sid) { state._editSid = sid; filterMyPlays(); }
function cancelEditSession() { state._editSid = null; filterMyPlays(); }
function toggleEditWin(btn) {
  const on = btn.getAttribute('data-win') === '1';
  btn.setAttribute('data-win', on ? '0' : '1');
  btn.classList.toggle('on', !on);
  btn.textContent = on ? '패' : '승 👑';
}

async function saveEditSession(sid) {
  if (!state.user) return;
  const card = document.querySelector(`.session[data-sid="${sid}"]`);
  if (!card) return;
  const play_date = card.querySelector('.edit-date').value;
  const duration_min = card.querySelector('.edit-duration').value;
  const rows = Array.from(card.querySelectorAll('.prow[data-rid]')).map(row => ({
    record_id: row.getAttribute('data-rid'),
    score: row.querySelector('.edit-score').value,
    is_win: row.querySelector('.edit-win').getAttribute('data-win') === '1'
  }));
  const pin = await promptPin();
  if (pin == null) return;
  showLoader('저장 중…');
  try {
    await api('updatePlay', { playerId: state.user.player_id, pin, payload: JSON.stringify({ session_id: sid, play_date, duration_min, rows }) });
    state.plays = await api('getPlays');
    state._myStats = null;
    state._editSid = null;
    toast('수정되었습니다.');
    refreshMySessions();
  } catch (e) {
    toast(e.message, true);
  } finally {
    hideLoader();
  }
}

async function deleteSession(sid) {
  if (!confirm('이 기록을 삭제하면 함께 플레이한 모든 참가자의 기록에서도 사라집니다.\n정말 삭제할까요?')) return;
  const pin = await promptPin();
  if (pin == null) return;
  showLoader('삭제 중…');
  try {
    await api('deletePlay', { playerId: state.user.player_id, pin, sessionId: sid });
    state.plays = await api('getPlays');
    state._myStats = null;
    state._editSid = null;
    toast('삭제되었습니다.');
    refreshMySessions();
  } catch (e) {
    toast(e.message, true);
  } finally {
    hideLoader();
  }
}

// 난이도(weight) 필터 구간
const WEIGHT_BUCKETS = [
  { key: '0-2', label: '0~2', lo: 0, hi: 2 },
  { key: '2-3', label: '2~3', lo: 2, hi: 3 },
  { key: '3-4', label: '3~4', lo: 3, hi: 4 },
  { key: '4-5', label: '4~5', lo: 4, hi: 5 }
];

function renderGames() {
  renderCategoryFilter();
  renderPlayerCountFilter();
  renderWeightFilter();
  renderGameCards();
}

function renderCategoryFilter() {
  const cats = [...new Set(state.games.map(g => g.category).filter(Boolean))];
  const cur = state.gameFilter.category;
  const el = document.getElementById('cat-filter');
  el.innerHTML =
    `<span class="chip ${!cur ? 'on' : ''}" onclick="setCatFilter(null)">전체</span>` +
    cats.map(c => `<span class="chip ${cur === c ? 'on' : ''}" onclick="setCatFilter('${esc(c)}')">${esc(c)}</span>`).join('');
}
function setCatFilter(c) { state.gameFilter.category = c; renderGames(); }

function renderPlayerCountFilter() {
  const cur = state.gameFilter.playerCount;
  const el = document.getElementById('player-filter');
  const counts = [2, 3, 4, 5, 6];
  el.innerHTML =
    `<span class="chip ${!cur ? 'on' : ''}" onclick="setPcFilter(null)">인원 전체</span>` +
    counts.map(n => `<span class="chip ${cur === n ? 'on' : ''}" onclick="setPcFilter(${n})">${n}명</span>`).join('') +
    `<span class="chip ${cur === 7 ? 'on' : ''}" onclick="setPcFilter(7)">7명+</span>`;
}
function setPcFilter(n) { state.gameFilter.playerCount = n; renderGames(); }

function renderWeightFilter() {
  const cur = state.gameFilter.weight;
  const el = document.getElementById('weight-filter');
  el.innerHTML =
    `<span class="chip ${!cur ? 'on' : ''}" onclick="setWeightFilter(null)">난이도 전체</span>` +
    WEIGHT_BUCKETS.map(b => `<span class="chip ${cur === b.key ? 'on' : ''}" onclick="setWeightFilter('${b.key}')">${b.label}</span>`).join('');
}
function setWeightFilter(key) { state.gameFilter.weight = key; renderGames(); }

document.getElementById('game-search').addEventListener('input', e => {
  state.gameFilter.search = e.target.value.trim().toLowerCase();
  renderGameCards();
});

function filteredGames() {
  const f = state.gameFilter;
  let list = state.games.slice();
  if (f.category) list = list.filter(g => g.category === f.category);
  if (f.playerCount) {
    const n = f.playerCount;
    list = list.filter(g => {
      const min = g.min_players, max = g.max_players;
      if (min == null && max == null) return false;
      const lo = min == null ? 1 : min;
      const hi = max == null ? 99 : max;
      return lo <= n && n <= hi;
    });
  }
  if (f.weight) {
    const b = WEIGHT_BUCKETS.find(x => x.key === f.weight);
    if (b) list = list.filter(g => {
      const w = g.weight;
      if (w == null) return false;
      // 경계값은 위 구간에 포함(2→2~3, 3→3~4, 4→4~5), 마지막 구간만 상한 포함
      return b.key === '4-5' ? (w >= b.lo && w <= b.hi) : (w >= b.lo && w < b.hi);
    });
  }
  if (f.search) {
    list = list.filter(g =>
      (g.name_kr || '').toLowerCase().includes(f.search) ||
      (g.name_en || '').toLowerCase().includes(f.search));
  }
  // 우리Hub평점 내림차순, 평점 없는 게임(-)은 하단
  list.sort((a, b) => {
    const ra = a.club_rating, rb = b.club_rating;
    if (ra == null && rb == null) return (a.name_kr || '').localeCompare(b.name_kr || '');
    if (ra == null) return 1;
    if (rb == null) return -1;
    return rb - ra;
  });
  return list;
}

function gameCardHtml(g, opts = {}) {
  const meta = [];
  if (g.min_players || g.max_players) {
    const mn = g.min_players || '?', mx = g.max_players || '?';
    meta.push(`👥 ${mn}${mx !== mn ? '~' + mx : ''}명`);
  }
  if (g.playtime_min) meta.push(`⏱ ${g.playtime_min}분`);
  if (g.weight) meta.push(`🧠 ${Number(g.weight).toFixed(2)}`);

  const club = g.club_rating != null
    ? `<span class="rate-club"><span class="star">★</span> ${g.club_rating.toFixed(1)} <small>(${g.rating_count})</small></span>`
    : `<span class="rate-club muted"><span class="star" style="color:#dcdce3">★</span> - <small>평가없음</small></span>`;

  const detail = g.summary_kr
    ? `<div class="gcard-detail">${esc(g.summary_kr)}</div>`
    : `<div class="gcard-detail muted">등록된 요약이 없습니다.</div>`;

  return `<div class="gcard" data-gid="${g.game_id}">
    <div class="gcard-top" onclick="toggleCard(this)">
      ${thumb(g.image_url, 'gcard-img')}
      <div class="gcard-body">
        <div class="gcard-name">${esc(g.name_kr || g.name_en)}
          ${g.category ? `<span class="badge" style="margin-left:6px;">${esc(g.category)}</span>` : ''}</div>
        ${g.name_en && g.name_kr ? `<div class="gcard-en">${esc(g.name_en)}</div>` : ''}
        <div class="gcard-meta">${meta.map(m => `<span>${m}</span>`).join('')}</div>
        <div class="gcard-ratings">${club}</div>
      </div>
    </div>
    ${detail}
    ${opts.ratingEditor ? ratingEditorHtml(g) : ''}
    ${opts.adminEdit ? `<button class="btn ghost sm" style="margin-top:10px;" onclick="openEditGame('${g.game_id}')">✏️ 정보 수정 (admin)</button>` : ''}
  </div>`;
}

function toggleCard(topEl) {
  topEl.parentElement.classList.toggle('open');
}

function renderGameCards() {
  const list = filteredGames();
  const el = document.getElementById('games-list');
  if (!list.length) {
    el.innerHTML = `<div class="empty"><div class="big">🎯</div>조건에 맞는 게임이 없어요.</div>`;
    return;
  }
  const isAdmin = state.user && state.user.role === 'admin';
  el.innerHTML = list.map(g => gameCardHtml(g, { adminEdit: isAdmin })).join('');
}

// 게임별 플레이 리스트(정렬: 승률순/판수순, 게임 이름 검색)
function renderMyGameStatList() {
  const stats = state._myStats;
  if (!stats) return;
  const sort = state.myGameSort || 'winrate';
  const input = document.getElementById('my-gamestat-search');
  const term = (input ? input.value : '').trim().toLowerCase();
  let rows = stats.by_game.slice();
  if (term) rows = rows.filter(g => String(g.game || '').toLowerCase().includes(term));
  rows.sort((a, b) => sort === 'plays'
    ? (b.plays - a.plays || b.win_rate - a.win_rate)
    : (b.win_rate - a.win_rate || b.plays - a.plays));

  const listEl = document.getElementById('my-gamestat-list');
  if (!listEl) return;
  if (!rows.length) {
    listEl.innerHTML = `<div class="empty">${term ? '검색 결과가 없어요.' : '아직 플레이 기록이 없어요.'}</div>`;
    return;
  }
  listEl.innerHTML = rows.map((g, i) => {
    const sc = myGameScores(g.game_id);
    const scoreText = sc.has ? `평균 ${sc.avg}점 · 최고 ${sc.max}점` : '점수 없음';
    const rightNum = sort === 'plays' ? `${g.plays}` : `${g.win_rate}%`;
    const rightLbl = sort === 'plays' ? '판수' : '승률';
    return `<div class="grow">

        <div class="grow-sub">${g.plays}판 · ${g.wins}승 · ${scoreText}</div>

      </div>
      <div class="grow-rate"><div class="r">${rightNum}</div><div class="rl">${rightLbl}</div></div>
    </div>`;
  }).join('');
}

// 로그인한 본인이 특정 게임에서 낸 점수들의 평균/최고 (점수 없으면 has=false)
function myGameScores(gameId) {
  const scores = [];
  state.plays.forEach(s => {
    if (s.game_id !== gameId) return;
    s.participants.forEach(p => {
      if (p.player_id === state.user.player_id && p.score != null && p.score !== '') {
        const n = Number(p.score);
        if (!isNaN(n)) scores.push(n);
      }
    });
  });
  if (!scores.length) return { has: false };
  const avg = Math.round((scores.reduce((a, b) => a + b, 0) / scores.length) * 10) / 10;
  const max = Math.max(...scores);
  return { has: true, avg, max };
}

function ratingEditorHtml(g) {
  const existing = (state._myRatings && state._myRatings[g.game_id]) || null;
  const val = existing ? existing.rating : 0;
  const memo = existing ? existing.memo : '';
  return `<div class="rate-edit" data-gid="${g.game_id}">
    <label style="font-size:12px;font-weight:700;color:var(--text-sub);">내 평점 (1~10, 0.5 단위)</label>
    <div class="stars" id="stars-${g.game_id}">${starsHtml(val)}</div>
    <div class="rate-val" id="rateval-${g.game_id}">${val ? val.toFixed(1) + ' 점' : '평점을 선택하세요'}</div>
    <textarea class="input" id="memo-${g.game_id}" placeholder="나만의 메모 (전략 노트 등)">${esc(memo)}</textarea>
    <button class="btn sm" style="margin-top:8px;" onclick="saveRating('${g.game_id}')">평점 저장</button>
  </div>`;
}

function starsHtml(val) {
  // 별 10개 = 10점 만점. 별 1개 = 1점, 별 왼쪽 절반 = 0.5점 (0.5 단위)
  let html = '';
  for (let i = 1; i <= 10; i++) {
    const full = val >= i;
    const half = !full && val >= i - 0.5;
    html += `<span class="s ${full ? 'filled' : (half ? 'half' : '')}"
      data-star="${i}"
      onclick="pickStar(event, ${i})"
      oncontextmenu="return false;">★</span>`;
  }
  return html;
}

// 별 왼쪽 절반 탭 = 0.5점, 오른쪽 = 1.0점
function pickStar(e, starIndex) {
  const rect = e.target.getBoundingClientRect();
  const isLeft = (e.clientX - rect.left) < rect.width / 2;
  const val = starIndex - (isLeft ? 0.5 : 0);
  const gid = e.target.closest('.rate-edit').dataset.gid;
  const container = document.getElementById('stars-' + gid);
  container.innerHTML = starsHtml(val);
  container.dataset.val = val;
  document.getElementById('rateval-' + gid).textContent = (val / 1).toFixed(1) + ' 점';
}

async function saveRating(gameId) {

  if (!val) { toast('평점을 선택하세요.', true); return; }
  const memo = document.getElementById('memo-' + gameId).value;
  showLoader('저장 중…');
  try {
    await api('saveRating', {
      playerId: state.user.player_id, pin, gameId, rating: val, memo
    });
    if (!state._myRatings) state._myRatings = {};
    state._myRatings[gameId] = { game_id: gameId, rating: val, memo };

    state.games = await api('getGames');
    toast('평점이 저장되었습니다!');
  } catch (e) {
    toast(e.message, true);
  } finally {

}

// 파일을 최대 maxDim px 썸네일 JPEG data URI로 변환. GET 전송 위해 targetLen 이하로 압축.
function fileToThumbDataUrl(file, maxDim, targetLen) {
  // 카드 썸네일은 작으므로(≤68px) 120px면 충분. GET URL 길이 안전하게 ~6.5KB 이하로 압축.
  maxDim = maxDim || 120;
  targetLen = targetLen || 6500;
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('read fail'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('decode fail'));
      img.onload = () => {
        const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
        const w = Math.max(1, Math.round(img.width * scale));
        const h = Math.max(1, Math.round(img.height * scale));
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        let q = 0.6;
        let out = canvas.toDataURL('image/jpeg', q);
        while (out.length > targetLen && q > 0.25) { q -= 0.1; out = canvas.toDataURL('image/jpeg', q); }
        resolve(out);
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

async function onPhotoPick(input, prefix) {
  const file = input.files && input.files[0];
  if (!file) return;
  showLoader('사진 처리 중…');

    photoState[prefix] = dataUrl;
    document.getElementById(prefix + '-photo-preview').innerHTML =
      `<div style="margin-top:8px;display:flex;align-items:center;gap:10px;">
         <img src="${dataUrl}" style="width:64px;height:64px;object-fit:cover;border-radius:10px;"/>
         <button type="button" class="btn ghost sm" onclick="clearPhoto('${prefix}')">사진 제거</button>
       </div>`;
  } catch (e) {
    toast('사진을 불러오지 못했습니다.', true);
  } finally {
    hideLoader();
  }
}

function clearPhoto(prefix) {

// ----- 플레이 결과 추가 -----
const addPlayState = { participants: [] };

// 정확히 일치하는 게임/플레이어만 허용(데이터 오류 방지)
function gameByExactName(name) {
  name = (name || '').trim();
  if (!name) return null;
  return state.games.find(g => (g.name_kr || '') === name || (g.name_en || '') === name) || null;
}
function playerByExactName(name) {
  name = (name || '').trim();
  if (!name) return null;
  return state.players.find(p => (p.name || '') === name) || null;
}

function renderAddPlayForm() {
  if (!addPlayState.participants.length) {
    addPlayState.participants = [{ name: '', score: '', is_win: false, is_guest: false }];
  }
  const el = document.getElementById('add-play-form');
  const gameListOpts = state.games.slice()
    .sort((a, b) => (a.name_kr || '').localeCompare(b.name_kr || ''))
    .map(g => `<option value="${esc(g.name_kr || g.name_en)}"></option>`).join('');
  const playerListOpts = state.players.map(p => `<option value="${esc(p.name)}"></option>`).join('');
  const today = new Date().toISOString().substring(0, 10);

  el.innerHTML = `
    <div class="row2">
      <div class="field"><label>플레이 일자</label><input class="input" id="ap-date" type="date" value="${today}" /></div>
      <div class="field"><label>플레이 시간(분)</label><input class="input" id="ap-duration" type="number" inputmode="numeric" placeholder="예: 45" /></div>
    </div>
    <div class="field">
      <label>게임 * (검색하거나 목록에서 선택)</label>
      <input class="input" id="ap-game" list="ap-game-list" placeholder="게임명 입력/선택" autocomplete="off" />
      <datalist id="ap-game-list">${gameListOpts}</datalist>
      <div class="hint">목록에 있는 게임명과 정확히 일치해야 저장됩니다.</div>
    </div>
    <div class="field">
      <label>참가자 (검색하거나 선택)</label>
      <div id="ap-participants"></div>
      <button class="btn ghost sm" style="margin-top:6px;" onclick="addParticipant()">+ 참가자 추가</button>
    </div>
    <datalist id="ap-player-list">${playerListOpts}</datalist>
    <button class="btn" style="margin-top:8px;" onclick="submitAddPlay()">플레이 결과 저장</button>`;
  renderParticipants();
}

function renderParticipants() {
  const el = document.getElementById('ap-participants');
  el.innerHTML = addPlayState.participants.map((pt, i) => `
    <div style="margin-bottom:10px;">
      <div class="ppart" style="margin-bottom:4px;">
        <input ${pt.is_guest ? '' : 'list="ap-player-list"'} placeholder="${pt.is_guest ? '게스트 닉네임' : '회원 이름 입력/선택'}" autocomplete="off" style="flex:2;min-width:0;"
               value="${esc(pt.name)}" oninput="updatePart(${i}, 'name', this.value)" />
        <input type="number" inputmode="numeric" placeholder="점수" value="${esc(pt.score)}" oninput="updatePart(${i}, 'score', this.value)" />
        <button class="wintoggle ${pt.is_win ? 'on' : ''}" onclick="toggleWin(${i})">${pt.is_win ? '승 👑' : '패'}</button>
        ${addPlayState.participants.length > 1 ? `<button class="rm-btn" onclick="removePart(${i})">×</button>` : ''}
      </div>
      <label style="display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--text-sub);cursor:pointer;padding-left:2px;">
        <input type="checkbox" ${pt.is_guest ? 'checked' : ''} onchange="toggleGuest(${i}, this.checked)" style="width:15px;height:15px;margin:0;" />
        비회원(게스트)
      </label>
    </div>`).join('');
}

function addParticipant() {
  addPlayState.participants.push({ name: '', score: '', is_win: false, is_guest: false });
  renderParticipants();
}
function removePart(i) { addPlayState.participants.splice(i, 1); renderParticipants(); }
function updatePart(i, field, val) { addPlayState.participants[i][field] = val; }
function toggleWin(i) { addPlayState.participants[i].is_win = !addPlayState.participants[i].is_win; renderParticipants(); }
function toggleGuest(i, checked) { addPlayState.participants[i].is_guest = checked; renderParticipants(); }

async function submitAddPlay() {
  const game = gameByExactName(document.getElementById('ap-game').value);
  if (!game) { toast('게임을 목록에 있는 이름으로 정확히 입력/선택하세요.', true); return; }
  const playDate = document.getElementById('ap-date').value;
  const duration = document.getElementById('ap-duration').value;

  const rawParts = addPlayState.participants.filter(p => (p.name || '').trim());
  if (!rawParts.length) { toast('참가자를 추가하세요.', true); return; }
  const resolved = [];
  const seen = new Set();
  for (const p of rawParts) {
    const nm = p.name.trim();
    let player_id = '', player_name = nm;
    if (p.is_guest) {
      // 게스트: 자유 닉네임 그대로 저장(회원 계정 연결 안 함)
      player_id = '';
      player_name = nm;
    } else {
      const pl = playerByExactName(nm);
      if (!pl) { toast(`"${nm}"은(는) 회원 명단에 없어요. 비회원이면 아래 '비회원(게스트)'를 체크하세요.`, true); return; }
      player_id = pl.player_id;
      player_name = pl.name;
    }
    const key = player_id ? ('m:' + player_id) : ('g:' + player_name);
    if (seen.has(key)) { toast('참가자가 중복되었습니다.', true); return; }
    seen.add(key);
    resolved.push({ player_id, player_name, score: p.score, is_win: !!p.is_win });
  }

  const pin = await promptPin();
  if (pin == null) return;

  const payload = {
    player_id: state.user.player_id, pin,
    play_date: playDate, duration_min: duration, game_id: game.game_id,
    participants: resolved
  };

  showLoader('저장 중…');
  try {
    await api('addPlay', { payload: JSON.stringify(payload) });
    state.plays = await api('getPlays');
    state.games = await api('getGames');
    state._myStats = null;    // 새 플레이는 개인 통계에 영향 → 다음 MY 진입 시 새로 로드
    addPlayState.participants = [];
    toast('플레이 결과가 저장되었습니다!');
    closeAddSheet();
    switchView('play');
    renderPlay();
  } catch (e) {
    toast(e.message, true);
  } finally {
    hideLoader();
  }
}
