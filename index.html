<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#534AB7" />
<title>보드게임 Hub</title>
<!-- PWA (앱처럼 설치/실행) -->
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="보드게임 Hub" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet" />
<style>
  :root {
    --main: #534AB7;
    --main-dark: #3f379a;
    --main-light: #ece9fb;
    --main-soft: #b9b3ec;
    --bg: #f5f5f8;
    --card: #ffffff;
    --text: #1b1b21;
    --text-sub: #6b6b78;
    --border: #eaeaef;
    --win: #f4b740;
    --danger: #e2564d;
    --ok: #2fa96b;
    --radius: 16px;
    --tabbar-h: 62px;
    --maxw: 720px;
    --sheet-h: 85vh;   /* 하단 시트 최대 높이(공통) */
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #dcdce3;
    color: var(--text);
    font-size: 15px;
    line-height: 1.45;
  }
  #app {
    max-width: var(--maxw);
    margin: 0 auto;
    min-height: 100vh;
    background: var(--bg);
    position: relative;
    box-shadow: 0 0 40px rgba(0,0,0,.08);
    display: flex;
    flex-direction: column;
  }
  button { font-family: inherit; cursor: pointer; border: none; background: none; }
  input, select, textarea { font-family: inherit; font-size: 15px; }
  a { color: var(--main); }

  /* ===== Header ===== */
  .appbar {
    position: sticky; top: 0; z-index: 40;
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 14px 18px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px;
  }
  .appbar h1 { font-size: 18px; font-weight: 900; margin: 0; letter-spacing: -.02em; }
  .appbar h1 .dice { color: var(--main); }
  .appbar .who { font-size: 12px; color: var(--text-sub); }
  .appbar .who b { color: var(--main); }

  /* ===== Content ===== */
  .view { flex: 1; padding: 16px 16px calc(var(--tabbar-h) + 84px); display: none; }
  .view.active { display: block; }

  /* ===== Cards / common ===== */
  .card {
    background: var(--card);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    padding: 14px;
    margin-bottom: 12px;
  }
  .section-title { font-size: 13px; font-weight: 700; color: var(--text-sub); margin: 4px 2px 10px; }

  /* summary blocks */
  .summary-row { display: flex; gap: 10px; margin-bottom: 14px; }
  .stat {
    flex: 1; min-width: 0; background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 9px 10px; text-align: center;
  }
  .stat .num { font-size: 22px; font-weight: 900; color: var(--main); }
  .stat .lbl { font-size: 11px; color: var(--text-sub); margin-top: 3px; }
  .stat.hero { background: var(--main); border-color: var(--main); }
  .stat.hero .num, .stat.hero .lbl { color: #fff; }

  /* pills / badges */
  .badge {
    display: inline-block; font-size: 11px; font-weight: 700; padding: 3px 8px;
    border-radius: 999px; background: var(--main-light); color: var(--main);
  }
  .chip {
    display: inline-flex; align-items: center; white-space: nowrap;
    font-size: 13px; padding: 7px 14px; border-radius: 999px;
    background: var(--card); border: 1px solid var(--border); color: var(--text-sub);
    font-weight: 500;
  }
  .chip.on { background: var(--main); color: #fff; border-color: var(--main); }
  .chip-row { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 4px; -webkit-overflow-scrolling: touch; }
  .chip-row::-webkit-scrollbar { display: none; }
  /* 마지막 필터줄(난이도)과 첫 게임카드 사이 간격 = 검색창↔필터 간격과 동일하게 */
  #games-list { margin-top: 10px; }

  /* inputs */
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12px; font-weight: 700; color: var(--text-sub); margin-bottom: 6px; }
  .input, select.input, textarea.input {
    width: 100%; padding: 12px 14px; border: 1px solid var(--border);
    border-radius: 12px; background: #fafafc; color: var(--text); outline: none;
  }
  .input:focus { border-color: var(--main); background: #fff; }
  textarea.input { resize: vertical; min-height: 72px; }
  .btn {
    width: 100%; padding: 14px; border-radius: 12px; background: var(--main);
    color: #fff; font-weight: 700; font-size: 15px;
  }
  .btn:active { background: var(--main-dark); }
  .btn.ghost { background: var(--main-light); color: var(--main); }
  .btn.sm { width: auto; padding: 9px 16px; font-size: 13px; }
  /* 내가 작성하지 않은 기록: 수정 버튼과 같은 크기의 회색 '작성자' 버튼 */
  .btn.author { background: #ececf1; color: var(--text-sub); font-weight: 700; max-width: 96px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .btn.author:active { background: #e0e0e6; }
  /* 연동 모달: 선택된 플레이기록 카드 강조(체크박스 대신 보라 테두리) */
  .link-row { transition: border-color .12s, background .12s; }
  .link-row.sel { border-color: var(--main) !important; background: var(--main-light); }
  .btn:disabled { opacity: .5; }
  .btn.danger { background: var(--danger); }

  /* search box */
  .searchbox {
    display: flex; align-items: center; gap: 8px; background: var(--card);
    border: 1px solid var(--border); border-radius: 12px; padding: 10px 14px; margin-bottom: 12px;
  }
  .searchbox input { border: none; background: none; outline: none; width: 100%; }
  /* 검색창 + 평점 정렬 버튼 한 줄 배치 */
  .searchrow { display: flex; gap: 8px; align-items: stretch; margin-bottom: 12px; }
  .searchrow .searchbox { flex: 1; margin-bottom: 0; }
  .sortbtn {
    flex: 0 0 auto; display: flex; align-items: center;
    padding: 0 13px; border-radius: 12px; border: 1px solid var(--border);
    background: var(--card); color: var(--text-sub); font-size: 13px; font-weight: 700;
    white-space: nowrap;
  }
  .sortbtn.on { background: var(--main); border-color: var(--main); color: #fff; }

  /* ===== Play session card ===== */
  .session {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px; margin-bottom: 10px;
  }
  .session-head { display: flex; gap: 12px; align-items: center; margin-bottom: 10px; }
  /* thumbnail wrapper: shows 🎲 placeholder behind the image; if the image
     fails to load (e.g. BGG hotlink block) the placeholder stays visible */
  .thumb {
    position: relative; flex-shrink: 0; overflow: hidden;
    background: var(--main-light);
    display: flex; align-items: center; justify-content: center;
  }
  .thumb::after { content: '🎲'; font-size: 22px; }
  .thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .session-thumb {
    width: 46px; height: 46px; border-radius: 12px;
  }
  .session-head .g-name { font-weight: 700; font-size: 15px; }
  .session-head .g-meta { font-size: 12px; color: var(--text-sub); margin-top: 2px; }
  .participants { display: flex; flex-direction: column; gap: 6px; }
  .prow {
    display: flex; align-items: center; justify-content: space-between;
    padding: 7px 10px; border-radius: 10px; background: #fafafc;
  }
  .prow.win { background: #fff8e8; }
  .prow .pname { font-weight: 500; font-size: 14px; }
  .prow .pscore { font-size: 13px; color: var(--text-sub); font-weight: 700; }
  .crown { margin-left: 4px; }

  /* ===== Game card ===== */
  .gcard {
    position: relative;
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 12px; margin-bottom: 10px; overflow: hidden;
  }
  .gcard-edit {
    position: absolute; top: 6px; right: 6px; z-index: 2;
    width: 20px; height: 20px; border-radius: 6px; padding: 0;
    background: transparent; color: var(--text-sub); font-size: 12px; line-height: 1; opacity: .6;
  }
  .gcard-edit:active { opacity: 1; }
  .rate-mine { font-size: 13px; font-weight: 700; color: var(--ok); }
  .rate-mine .star { color: var(--win); }
  .gcard-top { display: flex; gap: 12px; }
  .gcard-img {
    width: 68px; height: 68px; border-radius: 12px;
  }
  .gcard-body { flex: 1; min-width: 0; }
  .gcard-name { font-weight: 700; font-size: 15px; letter-spacing: -.01em; }
  .gcard-en { font-size: 11px; color: var(--text-sub); margin-top: 1px; }
  .gcard-meta { font-size: 12px; color: var(--text-sub); margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px 10px; }
  .gcard-ratings { display: flex; gap: 14px; margin-top: 5px; align-items: center; }
  .rate-club { font-weight: 900; font-size: 16px; color: var(--main); }
  .rate-club .star { color: var(--win); }
  .rate-club small { font-size: 11px; color: var(--text-sub); font-weight: 500; }
  .gcard-detail { display: none; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); font-size: 13px; color: #444; white-space: pre-wrap; }
  .gcard.open .gcard-detail { display: block; }
  .gcard-editwrap { display: none; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }
  .gcard.open .gcard-editwrap { display: block; }

  /* MY 게임기록: 일자별 플레이 요약 */
  /* 게임 정보 + 요약 제목은 시트 상단에 고정, 아래 리스트만 스크롤 */
  .mgstat-head { position: sticky; top: 0; z-index: 2; background: var(--bg); padding-bottom: 4px; }
  .pdate-head { font-size: 13px; font-weight: 800; color: var(--text-sub); margin: 14px 0 8px; }
  .pdate-list { display: flex; flex-direction: column; gap: 6px; padding-bottom: 2px; }
  .pdate-row { display: flex; align-items: center; gap: 8px; padding: 9px 10px; background: var(--card); border: 1px solid var(--border); border-radius: 10px; cursor: pointer; font-size: 13px; }
  .pdate-row:active { background: #f0f0f3; }
  .pdate-d { font-weight: 700; flex: 0 0 auto; }
  .pdate-wl { flex: 0 0 auto; font-weight: 700; font-size: 12px; padding: 1px 8px; border-radius: 999px; }
  .pdate-wl.win { color: var(--win); background: #fff7e6; }
  .pdate-wl.loss { color: var(--text-sub); background: #f0f0f3; }
  .pdate-s { flex: 1 1 auto; text-align: right; white-space: nowrap; }
  .pdate-s.muted { flex: 0 0 auto; }
  .pdate-arrow { flex: 0 0 auto; color: var(--text-sub); font-size: 16px; }

  /* 게임 상세 페이지 (전체 화면) */
  #gd-page { position: fixed; inset: 0; z-index: 130; background: var(--bg); overflow-y: auto; display: none;
    max-width: var(--maxw); margin: 0 auto;
    padding: 0 16px calc(24px + env(safe-area-inset-bottom, 0)); }
  #gd-page.show { display: block; }
  .gd-header { position: sticky; top: 0; z-index: 2; background: var(--bg); padding: 12px 4px 8px;
    margin: 0 -16px; padding-left: 12px; padding-right: 12px; display: flex; align-items: center; justify-content: space-between; }
  .gd-back { font-size: 15px; font-weight: 700; color: var(--main); padding: 6px 8px; }
  .gd-back:active { opacity: .6; }
  .gd-memo-btn { padding: 6px 12px; border-radius: 999px; background: var(--main-light); color: var(--main); font-size: 12px; font-weight: 800; }
  .gd-memo-btn:active { background: #ddd7f7; }
  /* [상세] 버튼 (일자별요약 헤더: 평점 줄 오른쪽 끝) */
  .gcard-detail-btn { position: absolute; right: 0; bottom: -2px; z-index: 2;
    padding: 4px 10px; border-radius: 999px; background: var(--main-light); color: var(--main);
    font-size: 11px; font-weight: 800; line-height: 1.4; }
  .gcard-detail-btn:active { background: #ddd7f7; }
  /* 카드 우측 상단 액션 버튼들(상세/후기/수정) */
  .gcard-actions { position: absolute; top: 8px; right: 8px; z-index: 2; display: flex; gap: 6px; align-items: center; }
  /* 후기 버튼 우측 하단 배치(br): 플레이탭 카드는 카드 하단, 게임탭 카드는 평점 줄 끝 */
  .gcard-actions.br { top: auto; bottom: 11px; }
  .gcard-top { position: relative; }
  .gcard-top .gcard-actions.br { right: 0; bottom: -2px; }
  .gcard-pill { padding: 4px 10px; border-radius: 999px; background: var(--main-light); color: var(--main);
    font-size: 11px; font-weight: 800; line-height: 1.4; white-space: nowrap; }
  .gcard-pill:active { background: #ddd7f7; }
  .gcard-pill.edit { padding: 4px 8px; }
  .gcard-pill.review { background: transparent; }
  .gcard-pill.review:active { background: var(--main-light); }
  /* 후기 목록 시트 */
  .rv-row { padding: 11px 2px; border-bottom: 1px solid var(--border); }
  .rv-row:last-child { border-bottom: none; }
  .rv-name { font-weight: 800; font-size: 13px; }
  .rv-name .rv-when { font-weight: 500; font-size: 11px; color: var(--text-sub); margin-left: 6px; }
  .rv-text { font-size: 13px; color: #444; margin-top: 3px; white-space: pre-wrap; word-break: break-word; }
  /* 후기 탭: 채팅형 (내 후기 오른쪽 / 남의 후기 왼쪽) */
  .rv-chat { display: flex; flex-direction: column; gap: 12px; padding: 4px 0; }
  .rvm { display: flex; gap: 8px; align-items: flex-start; }
  .rvm.mine { flex-direction: row-reverse; }
  .rvm .thumb.rvm-av { width: 42px; height: 42px; border-radius: 12px; cursor: pointer; }
  .rvm .thumb.rvm-av::after { font-size: 18px; }
  .rvm-body { display: flex; flex-direction: column; gap: 3px; max-width: 80%; min-width: 0; }
  .rvm.mine .rvm-body { align-items: flex-end; }
  .rvm-head { font-size: 11px; color: var(--text-sub); font-weight: 700; padding: 0 4px;
    max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rvm-bubble { background: var(--card); border: 1px solid var(--border);
    border-radius: 4px 14px 14px 14px; padding: 9px 12px; font-size: 13px; line-height: 1.45;
    color: var(--text); white-space: pre-wrap; word-break: break-word; cursor: pointer; }
  .rvm.mine .rvm-bubble { background: var(--main-light); border-color: transparent; border-radius: 14px 4px 14px 14px; }
  .rvm-bubble:active { filter: brightness(.97); }
  /* 말풍선 옆 날짜(채팅 타임스탬프): 남의 후기=오른쪽, 내 후기=왼쪽 */
  .rvm-bubble-row { display: flex; align-items: flex-end; gap: 5px; min-width: 0; }
  .rvm.mine .rvm-bubble-row { flex-direction: row-reverse; }
  .rvm-date { font-size: 10px; color: var(--text-sub); white-space: nowrap; flex: 0 0 auto; padding-bottom: 2px; }
  /* MY-플레이 달력 */
  .cal-wrap { background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px; margin-bottom: 2px; }
  .cal-head { display: flex; align-items: center; justify-content: center; gap: 18px; margin-bottom: 8px; }
  .cal-nav { background: none; border: none; font-size: 20px; color: var(--text-sub); padding: 2px 12px; cursor: pointer; line-height: 1; }
  .cal-title { font-weight: 800; font-size: 15px; min-width: 74px; text-align: center; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 0; }
  .cal-wd { text-align: center; font-size: 11px; color: var(--text-sub); font-weight: 700; padding-bottom: 2px; }
  .cal-wd.sun { color: #d9534f; } .cal-wd.sat { color: #4a7bd9; }
  .cal-cell { position: relative; aspect-ratio: 1; border-radius: 9px; background: var(--card);
    border: 1px solid var(--border); overflow: hidden; }
  .cal-cell.empty { background: none; border: none; }
  .cal-cell.has { cursor: pointer; }
  .cal-cell.has:not(.img) { background: var(--main-light); }   /* 플레이 있으나 이미지 없는 날 */
  .cal-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .cal-d { position: absolute; top: 3px; left: 5px; font-size: 11px; font-weight: 600; color: var(--text-sub); z-index: 1; }
  .cal-cell.has:not(.img) .cal-d { color: var(--main); font-weight: 800; }
  .cal-cell.img .cal-d { color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.75); }
  .cal-cell.sel { outline: 2px solid var(--main); outline-offset: -2px; }
  .cal-cell.sel::after { content: ''; position: absolute; inset: 0; box-shadow: inset 0 0 0 2px var(--main); border-radius: 9px; }
  .session.clickable { cursor: pointer; }
  .session.clickable:active { background: #f6f5fb; }
  /* 달력 게임 칩 줄: 헤더 아래에 sticky(상단 한계로 붙었다가 내리면 원위치) */
  #my-cal-chips { position: sticky; top: var(--appbar-h, 52px); z-index: 30;
    background: var(--bg); padding-top: 5px; padding-bottom: 8px; margin-bottom: 4px;
    box-shadow: 0 6px 8px -6px rgba(0,0,0,.12); }
  /* 후기 작성 중앙 팝업 */
  #rvwrite-overlay { position: fixed; inset: 0; z-index: 150; background: rgba(20,20,30,.45);
    display: none; align-items: center; justify-content: center; padding: 20px; }
  #rvwrite-overlay.show { display: flex; }
  .rvwrite-card { background: var(--bg); border-radius: 18px; width: 100%; max-width: 420px;
    max-height: 82vh; overflow-y: auto; padding: 18px 16px calc(16px + env(safe-area-inset-bottom, 0)); }
  .rvw-list { display: flex; flex-direction: column; gap: 8px; }
  .rvw-pick { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
    padding: 8px; border: 1px solid var(--border); border-radius: 12px; background: var(--card); }
  .rvw-pick:active { background: #f6f5fb; }
  .rvw-pick.done { background: #eeeef2; border-color: #e2e2ea; }   /* 후기 쓴 게임 = 옅은 회색 */
  .rvw-pick .thumb.rvw-thumb { width: 42px; height: 42px; border-radius: 10px; }
  .rvw-pick-name { font-weight: 700; font-size: 14px; min-width: 0; }
  .rvw-done-tag { font-size: 10px; font-weight: 700; color: var(--text-sub);
    background: #dcdce4; border-radius: 6px; padding: 1px 6px; margin-left: 4px; white-space: nowrap; }
  .thumb.rvw-thumb-lg { width: 48px; height: 48px; border-radius: 12px; }
  /* 게임메모 편집 오버레이 (게임 상세 위) */
  #gd-memo-overlay, #gd-session-overlay { position: fixed; inset: 0; z-index: 150; background: rgba(20,20,30,.45);
    display: none; align-items: center; justify-content: center; padding: 20px; }
  #gd-memo-overlay.show, #gd-session-overlay.show { display: flex; }
  #gd-session-card h3 { font-size: 15px; font-weight: 800; margin: 0 0 2px; }

  /* 관리자 페이지 (전체 화면, 오버레이(100)보다 아래라 수정 시트가 위에 뜸) */
  #admin-page { position: fixed; inset: 0; z-index: 90; background: var(--bg); overflow-y: auto; display: none;
    max-width: var(--maxw); margin: 0 auto;
    padding: 0 16px calc(24px + env(safe-area-inset-bottom, 0)); }
  #admin-page.show { display: block; }
  .adm-searchrow { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; }
  .adm-searchrow .searchbox { flex: 1; margin: 0; }
  .adm-pill { flex: 0 0 auto; padding: 9px 14px; border-radius: 999px; background: var(--main-light);
    color: var(--main); font-size: 12px; font-weight: 800; white-space: nowrap; }
  .adm-pill:active { background: #ddd7f7; }
  .adm-gcard { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 12px; margin-bottom: 12px; cursor: pointer; }
  .adm-gcard:active { background: #f6f5fb; }
  .adm-summary { font-size: 12px; color: var(--text-sub); margin-top: 8px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .adm-creator { display: inline-block; font-size: 11px; font-weight: 700; color: var(--text-sub);
    background: #ececf1; border-radius: 6px; padding: 2px 8px; margin-left: 6px; }
  /* 기간 필터: 두 날짜칸을 한 묶음(라벨+입력)으로 만들고, 폭이 좁으면 겹치지 않게 줄바꿈(세로 배치) */
  .adm-daterow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; margin-bottom: 12px; }
  .adm-datefield { flex: 1 1 160px; display: flex; align-items: center; gap: 6px; min-width: 0; }
  .adm-datefield label { flex: 0 0 auto; font-size: 11px; font-weight: 700; color: var(--text-sub); white-space: nowrap; }
  .adm-daterow input[type="date"] { flex: 1 1 auto; min-width: 120px; padding: 7px 8px; font-size: 12px; }
  .adm-prow { display: flex; gap: 8px; align-items: center; background: var(--card);
    border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; }
  .adm-prow .nm { flex: 1; min-width: 0; font-weight: 700; font-size: 14px; }
  .adm-prow .jd { font-size: 11px; color: var(--text-sub); }
  .adm-prow input.pin { width: 64px; padding: 8px; border: 1px solid var(--border); border-radius: 8px;
    background: #fafafc; text-align: center; font-weight: 700; }
  .cat-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  .cat-row input.cname { flex: 1; min-width: 0; }
  .cat-row input.csort { width: 58px; text-align: center; }
  .gd-memo-card { width: 100%; max-width: 420px; background: var(--card); border-radius: 16px; padding: 16px; }
  .gd-memo-card h3 { font-size: 15px; font-weight: 800; margin: 0 0 4px; }
  .gd-memo-card .muted { font-size: 12px; }
  .gd-memo-card textarea { width: 100%; min-height: 250px; margin-top: 10px; }
  .gd-top { display: flex; gap: 12px; align-items: center; margin-bottom: 6px; }
  .gd-mystat { font-size: 12.5px; color: var(--text-sub); margin-top: 6px; }
  .gd-sec { margin-top: 18px; }
  .gd-sec-title { font-size: 13px; font-weight: 800; color: var(--text-sub); margin: 0 0 8px; }
  .gd-chart { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 10px 6px 4px; }
  .gd-legend { display: flex; gap: 16px; justify-content: center; font-size: 11px; color: var(--text-sub); margin-top: 8px; }
  .gd-legend i { display: inline-block; width: 11px; height: 11px; border-radius: 3px; vertical-align: middle; margin-right: 4px; }
  .gd-table-wrap { overflow-x: auto; }
  .gd-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .gd-table th, .gd-table td { padding: 9px 6px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--border); }
  .gd-table th:first-child, .gd-table td:first-child { text-align: left; }
  .gd-table th { color: var(--text-sub); font-weight: 700; font-size: 11px; cursor: pointer; user-select: none; }
  .gd-table th.act { color: var(--main); }
  .gd-table tbody tr.me { background: var(--main-light); }
  .gd-table td:first-child { font-weight: 600; }

  /* rating editor (MY 게임기록) */
  .rate-edit { }
  .stars { display: flex; gap: 1px; font-size: 22px; user-select: none; }
  .stars .s { color: #dcdce3; cursor: pointer; line-height: 1; }
  .stars .s.filled { color: var(--win); }
  .stars .s.half { position: relative; color: #dcdce3; }
  .stars .s.half::before { content: '★'; position: absolute; left: 0; width: 50%; overflow: hidden; color: var(--win); }
  .rate-val { font-size: 13px; color: var(--text-sub); margin: 6px 0; font-weight: 700; }

  /* monthly mini chart */
  .barchart { display: flex; align-items: flex-end; gap: 8px; height: 96px; padding: 4px 2px 0; }
  .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; justify-content: flex-end; }
  .bar-col .bars { display: flex; align-items: flex-end; justify-content: center; gap: 3px; width: 100%; flex: 1; }
  .bwrap { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 2px; height: 100%; }
  .bar {
    width: 60%; max-width: 26px; background: var(--main); border-radius: 6px 6px 0 0; min-height: 3px;
    transition: height .3s;
  }
  .bars .bar { width: 13px; }
  .bar.soft { background: var(--main-soft); }
  .bar-col .bc { font-size: 9px; color: var(--text-sub); line-height: 1.1; }
  .bar-col .bc.soft { color: var(--main-soft); }
  .bar-col .bm { font-size: 10px; color: var(--text-sub); }
  /* 카테고리별 가로 막대(긴 한글 분류명 대응 + 상위 N + 기타) */
  .hbarchart { display: flex; flex-direction: column; gap: 1px; padding: 2px 0; }
  .hbar-row { display: flex; align-items: center; gap: 8px; }
  .hbar-name { flex: 0 0 66px; font-size: 11px; color: var(--text); white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; text-align: left; }
  .hbar-track { flex: 1; height: 9px; background: var(--main-light); border-radius: 5px; overflow: hidden; }
  .hbar-track > i { display: block; height: 100%; background: var(--main); border-radius: 5px; min-width: 3px; transition: width .3s; }
  .hbar-track > i.soft { background: var(--main-soft); }
  .hbar-val { flex: 0 0 auto; min-width: 16px; font-size: 11px; font-weight: 800; color: var(--text-sub); }
  /* 그래프 카드 상단 세그먼트 탭(월별 / 카테고리별 전환 티내기) */
  .chart-seg { display: inline-flex; gap: 3px; background: var(--main-light); border-radius: 999px; padding: 3px; }
  .chart-seg .seg { font-size: 12px; font-weight: 500; color: var(--text-sub); padding: 4px 12px;
    border-radius: 999px; line-height: 1.3; white-space: nowrap; }
  .chart-seg .seg.on { background: var(--main); color: #fff; }
  /* 난이도 옆 BGG 참고 링크(작은 텍스트 버튼) */
  .lnk-bgg { background: none; border: none; color: var(--main); font-size: 11px; font-weight: 700;
    padding: 0; cursor: pointer; white-space: nowrap; }
  /* 이미지 URL 제목 옆 '초기화'(작고 얇게) */
  .lnk-clear { background: none; border: none; color: var(--text-sub); font-size: 10px; font-weight: 400;
    padding: 0; cursor: pointer; text-decoration: underline; white-space: nowrap; }
  .legend-chips { display: flex; gap: 10px; font-size: 11px; font-weight: 700; color: var(--text-sub); }
  .legend-chips i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; vertical-align: -1px; margin-right: 4px; }

  /* game-stat list rows (MY 플레이) */
  .grow {
    display: flex; align-items: center; gap: 12px; padding: 11px 4px; border-bottom: 1px solid var(--border);
  }
  .grow:last-child { border-bottom: none; }
  .grow-rank { width: 22px; text-align: center; font-weight: 900; color: var(--text-sub); font-size: 13px; }
  .grow-body { flex: 1; min-width: 0; }
  .grow-name { font-weight: 700; font-size: 14px; }
  .grow-sub { font-size: 12px; color: var(--text-sub); }
  .grow-rate { text-align: right; }
  .grow-rate .r { font-weight: 900; color: var(--main); font-size: 16px; }
  .grow-rate .rl { font-size: 10px; color: var(--text-sub); }
  .winbar { height: 5px; background: var(--border); border-radius: 3px; margin-top: 5px; overflow: hidden; }
  .winbar > i { display: block; height: 100%; background: var(--main); border-radius: 3px; }

  /* ===== Bottom tabbar ===== */
  .tabbar {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: var(--maxw); height: var(--tabbar-h);
    background: var(--card); border-top: 1px solid var(--border);
    display: flex; z-index: 50;
    padding-bottom: env(safe-area-inset-bottom, 0);
  }
  .tab {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 3px; color: var(--text-sub); font-size: 11px; font-weight: 500;
  }
  .tab .ico { font-size: 20px; line-height: 1; }
  .tab.on { color: var(--main); font-weight: 700; }
  /* 탭바 중앙 원형 추가 버튼(살짝 위로 튀어나옴) */
  .tab-add {
    flex: 0 0 auto; align-self: center; width: 56px; height: 56px; margin: 0 4px;
    background: var(--main); color: #fff; border-radius: 50%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    transform: translateY(-6px); box-shadow: 0 4px 12px rgba(83,74,183,.35);
  }
  .tab-add:active { background: var(--main-dark); }
  .tab-add .plus { font-size: 22px; line-height: 1; font-weight: 300; }
  .tab-add .lbl { font-size: 10px; font-weight: 700; line-height: 1.2; margin-top: 1px; }

  /* ===== Modal / sheet ===== */
  .overlay {
    position: fixed; inset: 0; background: rgba(20,20,30,.45); z-index: 100;
    display: none; align-items: flex-end; justify-content: center;
  }
  .overlay.show { display: flex; }
  .sheet {
    width: 100%; max-width: var(--maxw); background: var(--bg);
    border-radius: 22px 22px 0 0; max-height: var(--sheet-h); overflow-y: auto;
    padding: 8px 16px calc(24px + env(safe-area-inset-bottom, 0));
    animation: slideup .25s ease;
  }
  /* 저장 버튼을 시트 하단에 고정 — 스크롤 위치와 관계없이 항상 눌리게 */
  .sheet-save {
    position: sticky; bottom: 0; z-index: 3; margin-top: 14px;
    box-shadow: 0 -12px 16px 10px var(--bg);
  }
  /* 추가 시트: 항상 최대 높이(--sheet-h)로 열림.
     플레이 결과 폼은 세로 flex — 일자·게임·참가자 헤더줄은 고정,
     참가자 목록(#ap-participants)만 내부 스크롤 */
  #add-overlay .sheet { height: var(--sheet-h); display: flex; flex-direction: column; }
  #add-play-form { flex: 1; min-height: 0; flex-direction: column; }  /* display는 탭 전환 JS가 지정 */
  /* 게임 추가 폼도 내부만 스크롤 → 그립(회색 바)·탭이 항상 고정으로 보이게 */
  #add-game-form { flex: 1; min-height: 0; overflow-y: auto; }
  .ap-parts-field { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .ap-parts-field > #ap-participants { flex: 1; min-height: 0; overflow-y: auto; }
  @keyframes slideup { from { transform: translateY(30px); opacity: .6; } to { transform: translateY(0); opacity: 1; } }
  .sheet-grip { width: 40px; height: 4px; background: #d3d3dc; border-radius: 3px; margin: 8px auto 12px; }
  .sheet h2 { font-size: 18px; margin: 4px 2px 16px; font-weight: 900; }
  .sheet-tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .sheet-tabs button {
    flex: 1; padding: 10px; border-radius: 10px; background: var(--card);
    border: 1px solid var(--border); font-weight: 700; font-size: 14px; color: var(--text-sub);
  }
  .sheet-tabs button.on { background: var(--main); color: #fff; border-color: var(--main); }

  /* participant rows in addPlay */
  .ppart { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  .ppart select { flex: 2; }
  .ppart input { flex: 1; min-width: 0; }
  .wintoggle {
    flex-shrink: 0; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border);
    background: #fafafc; font-weight: 700; font-size: 13px; color: var(--text-sub);
  }
  .wintoggle.on { background: var(--win); color: #fff; border-color: var(--win); }
  .rm-btn { flex-shrink: 0; color: var(--danger); font-size: 20px; padding: 4px 8px; }
  /* 회원 일치 배지 (플레이 결과 추가) */
  .mchk { font-size: 12px; }
  .mchk.ok { color: var(--ok); font-weight: 700; }
  .mchk.no { color: var(--text-sub); }
  .mchk.dup { color: var(--danger); font-weight: 700; }

  /* 접두어 자동완성 드롭다운 */
  .ac-wrap { position: relative; }
  .ac-wrap > input { width: 100%; }
  .ac-menu {
    display: none; position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 20;
    background: #fff; border: 1px solid var(--border); border-radius: 10px;
    box-shadow: 0 8px 20px rgba(20,20,40,.14); max-height: 190px; overflow-y: auto;
  }
  .ac-menu.show { display: block; }
  .ac-item { padding: 10px 12px; font-size: 14px; cursor: pointer; border-bottom: 1px solid var(--border); }
  .ac-item:last-child { border-bottom: none; }
  .ac-item:active { background: var(--main-light); color: var(--main); }

  /* ===== Toast / loader ===== */
  #toast {
    position: fixed; left: 50%; bottom: calc(var(--tabbar-h) + 30px); transform: translateX(-50%);
    background: #22222c; color: #fff; padding: 12px 20px; border-radius: 12px; font-size: 14px;
    z-index: 200; opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none;
    max-width: 88%; text-align: center; box-shadow: 0 6px 20px rgba(0,0,0,.25);
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(-6px); }
  #toast.err { background: var(--danger); }
  #loader {
    position: fixed; inset: 0; background: rgba(245,245,248,.7); z-index: 300;
    display: none; align-items: center; justify-content: center; flex-direction: column; gap: 12px;
  }
  #loader.show { display: flex; }
  .spinner {
    width: 40px; height: 40px; border: 4px solid var(--main-light); border-top-color: var(--main);
    border-radius: 50%; animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loader .ltxt { font-size: 13px; color: var(--text-sub); }

  .empty { text-align: center; color: var(--text-sub); padding: 40px 20px; font-size: 14px; }
  .empty .big { font-size: 34px; margin-bottom: 8px; }
  .muted { color: var(--text-sub); }
  .hint { font-size: 12px; color: var(--text-sub); margin-top: 4px; }
  .center-login { padding: 30px 8px; }
  .center-login .lg-ico { text-align: center; font-size: 46px; margin-bottom: 6px; }
  .center-login h2 { text-align: center; font-size: 20px; margin: 0 0 24px; }
  .subtabs { display: flex; gap: 6px; background: var(--main-light); padding: 4px; border-radius: 12px; margin-bottom: 14px; }
  .subtabs button { flex: 1; padding: 9px; border-radius: 9px; font-weight: 700; font-size: 13px; color: var(--main); }
  .subtabs button.on { background: var(--card); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .row2 { display: flex; gap: 10px; }
  .row2 > * { flex: 1; min-width: 0; }   /* date 등 고유폭 입력칸도 화면에 맞게 줄어들도록 */
  /* 날짜칸이 든 행: 좁은 화면에서 강제로 줄이지 않고, 안 들어가면 겹침 없이 세로로 줄바꿈 */
  .row2.wrapdate { flex-wrap: wrap; }
  .row2.wrapdate > * { flex: 1 1 150px; }
  /* iOS 사파리: 날짜칸이 고유 폭을 고집하며 CSS 폭을 무시하고 옆 칸을 덮는 버그
     → 네이티브 외형을 끄면(appearance:none) 지정한 폭을 그대로 따름 */
  input[type="date"] {
    -webkit-appearance: none; appearance: none;
    min-width: 0; max-width: 100%;
  }
  /* iOS: appearance 해제 후 값이 비면 높이가 주저앉음 → 글자 높이 확보,
     기본 가운데 정렬 → 다른 입력칸처럼 왼쪽 정렬 */
  input[type="date"]::-webkit-date-and-time-value {
    text-align: left; margin: 0; min-height: 1.45em;
  }
  .logout-link { font-size: 12px; color: var(--danger); text-decoration: underline; background: none; }
</style>
</head>
<body>
<div id="app">
  <div class="appbar">
    <h1><span class="dice">🎲</span> 보드게임 Hub <span id="build-tag" style="font-size:10px;font-weight:500;color:var(--text-sub);vertical-align:middle;">v1053</span></h1>
    <div style="display:flex;align-items:center;gap:10px;">
      <button id="admin-btn" onclick="openAdminPage()" title="관리자 페이지"
              style="display:none;background:#fff3e0;color:#c77700;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;">🛠</button>
      <button onclick="refreshAll()" title="최신 데이터로 업데이트"
              style="background:var(--main-light);color:var(--main);border-radius:999px;padding:5px 10px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;">🔄</button>
      <div class="who" id="whoami" onclick="switchView('my')" style="cursor:pointer;">비로그인</div>
    </div>
  </div>

  <!-- ===== VIEW: 플레이 ===== -->
  <div class="view" id="view-play">
    <div class="summary-row" id="play-summary"></div>
    <div id="play-catchart"></div>
    <div class="section-title" id="play-list-title">게임별 플레이 횟수</div>
    <div id="play-list"></div>
  </div>

  <!-- ===== VIEW: 게임 ===== -->
  <div class="view active" id="view-games">
    <div class="searchrow">
      <div class="searchbox">
        <span>🔍</span>
        <input id="game-search" placeholder="게임 이름 검색 (한글/영문)" />
      </div>
      <button class="sortbtn" id="game-sort-btn" title="평점 정렬" onclick="cycleGameSort()">평점</button>
    </div>
    <div class="chip-row" id="cat-filter"></div>
    <div class="chip-row" id="player-filter"></div>
    <div class="chip-row" id="weight-filter"></div>
    <div id="games-list"></div>
  </div>

  <!-- ===== VIEW: 후기 (채팅형) ===== -->
  <div class="view" id="view-reviews">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:2px;margin-bottom:10px;">
      <div class="section-title" style="margin:0;">💬 모두의 게임 후기</div>
      <button class="btn ghost sm" style="padding:7px 12px;font-size:12px;white-space:nowrap;" onclick="openReviewWrite()">✏️ 후기 쓰기</button>
    </div>
    <div class="rv-chat" id="reviews-list"></div>
  </div>

  <!-- ===== VIEW: MY ===== -->
  <div class="view" id="view-my">
    <div id="my-login" style="display:none;"></div>
    <div id="my-content" style="display:none;">
      <div class="subtabs">
        <button id="mytab-overview" class="on" onclick="switchMyTab('overview')">전체 기록</button>
        <button id="mytab-plays" onclick="switchMyTab('plays')">플레이 기록</button>
        <button id="mytab-games" onclick="switchMyTab('games')">게임 기록</button>
      </div>
      <div id="my-overview"></div>
      <div id="my-plays" style="display:none;"></div>
      <div id="my-games" style="display:none;"></div>
      <div style="text-align:center;margin:20px 0 4px;">
        <button class="logout-link" onclick="logout()">로그아웃</button>
      </div>
    </div>
  </div>

  <!-- Tabbar (가운데 원형 추가 버튼) -->
  <div class="tabbar">
    <button class="tab" id="tab-play" onclick="switchView('play')"><span class="ico">📋</span>플레이</button>
    <button class="tab on" id="tab-games" onclick="switchView('games')"><span class="ico">🎯</span>게임</button>
    <button class="tab-add" onclick="openAddSheet()" aria-label="추가"><span class="plus">+</span><span class="lbl">추가</span></button>
    <button class="tab" id="tab-reviews" onclick="switchView('reviews')"><span class="ico">💬</span>후기</button>
    <button class="tab" id="tab-my" onclick="switchView('my')"><span class="ico">👤</span>MY</button>
  </div>
</div>

<!-- ===== Add Sheet (게임추가 / 플레이추가) ===== -->
<div class="overlay" id="add-overlay">
  <div class="sheet">
    <div class="sheet-grip"></div>
    <div class="sheet-tabs">
      <button id="addtab-play" class="on" onclick="switchAddTab('play')">📋 플레이 결과</button>
      <button id="addtab-game" onclick="switchAddTab('game')">🎯 게임 추가</button>
    </div>
    <div id="add-game-form"></div>
    <div id="add-play-form" style="display:none;"></div>
  </div>
</div>

<!-- ===== Generic detail sheet (게임 상세) ===== -->
<div class="overlay" id="detail-overlay">
  <div class="sheet">
    <div class="sheet-grip"></div>
    <div id="detail-body"></div>
  </div>
</div>

<!-- ===== 후기 작성(중앙 팝업) ===== -->
<div id="rvwrite-overlay">
  <div class="rvwrite-card">
    <div id="rvwrite-body"></div>

function acErr(error) { return (error && (error.message || error.hint)) || '요청 실패'; }

async function sbrpc(fn, args = {}) {
  const { data, error } = await sb.rpc(fn, args);
  if (error) throw new Error(acErr(error));
  return data;
}

// player_id·pin이 payload 안에 들어있는 쓰기(addGame/addPlay)용
async function sbWriteWithPayload(fn, payloadStr) {
  const pl = JSON.parse(payloadStr);
  const { player_id, pin, ...rest } = pl;
  return sbrpc(fn, { p_player_id: player_id, p_pin: pin, p_payload: rest });
}

async function api(action, params = {}) {
  const P = params;
  switch (action) {
    case 'login':          return sbrpc('login',  { p_name: P.name, p_pin: P.pin });
    case 'signup':         return sbrpc('signup', { p_name: P.name, p_pin: P.pin });
    case 'getGames':       return sbrpc('get_games');

    case 'getPlayerStats': return sbrpc('get_player_stats', { p_player_id: P.playerId });
    case 'getMyRatings':   return sbrpc('get_my_ratings',   { p_player_id: P.playerId });
    case 'getPlayers': {
      const { data, error } = await sb.from('players_public').select('player_id,name,role').order('player_id');
      if (error) throw new Error(acErr(error));
      return data || [];
    }
    case 'getCategories': {
      const { data, error } = await sb.from('categories').select('name').order('sort_order').order('name');
      if (error || !data || !data.length) return DEFAULT_CATEGORIES_FALLBACK;
      return data.map(r => r.name);
    }
    case 'saveRating':
      return sbrpc('save_rating', {
        p_player_id: P.playerId, p_pin: P.pin, p_game_id: P.gameId, p_rating: Number(P.rating)
      });
    case 'saveReview':
      return sbrpc('save_review', {
        p_player_id: P.playerId, p_pin: P.pin, p_game_id: P.gameId, p_review: P.review || ''

      return sbrpc('admin_update_pin', { p_player_id: P.playerId, p_pin: P.pin, p_target_id: P.targetId, p_new_pin: P.newPin });
    case 'adminAddCategory':
      return sbrpc('admin_add_category', { p_player_id: P.playerId, p_pin: P.pin, p_name: P.name, p_sort: Number(P.sort) || 0 });
    case 'adminUpdateCategory':
      return sbrpc('admin_update_category', { p_player_id: P.playerId, p_pin: P.pin, p_old_name: P.oldName, p_new_name: P.newName, p_sort: Number(P.sort) || 0 });
    case 'adminDeleteGame':
      return sbrpc('admin_delete_game', { p_player_id: P.playerId, p_pin: P.pin, p_game_id: P.gameId });
    case 'getCategoriesFull': {
      const { data, error } = await sb.from('categories').select('name,sort_order').order('sort_order').order('name');
      if (error) throw new Error(acErr(error));
      return data || [];
    }
    case 'addPlay':   return sbWriteWithPayload('add_play', P.payload);
    case 'addGame':   return sbWriteWithPayload('add_game', P.payload);
    case 'updatePlay':
      return sbrpc('update_play', { p_player_id: P.playerId, p_pin: P.pin, p_payload: JSON.parse(P.payload) });
    case 'deletePlay':
      return sbrpc('delete_play', { p_player_id: P.playerId, p_pin: P.pin, p_session_id: P.sessionId });
    case 'updateGame':
      return sbrpc('update_game', { p_player_id: P.playerId, p_pin: P.pin, p_payload: JSON.parse(P.payload) });
    default: throw new Error('Unknown action: ' + action);
  }
}

// ===== 오버레이 히스토리 스택 (하드웨어/브라우저 뒤로가기 대응) =====
// 오버레이를 열 때 openOverlay(hide)로 등록하면 히스토리 항목이 1개 쌓이고,
// 뒤로가기(popstate) 또는 closeOverlay()로 맨 위 오버레이부터 하나씩 닫힘.
const _overlays = [];
function openOverlay(hideFn) {
  _overlays.push(hideFn);
  try { history.pushState({ ov: _overlays.length }, ''); } catch (e) {}
}
function closeOverlay() {   // UI 닫기 버튼/백드롭에서 호출 → 히스토리와 동기화
  if (!_overlays.length) return;
  try { history.back(); } catch (e) { const h = _overlays.pop(); if (h) h(); }
}
function replaceTopOverlay(hideFn) {  // 시트→상세 등 같은 depth로 화면 교체
  if (_overlays.length) _overlays[_overlays.length - 1] = hideFn;
  else openOverlay(hideFn);
}
let _backExitArmed = false;
let _backExitTimer = null;
window.addEventListener('popstate', () => {
  // 열린 오버레이(시트/팝업)가 있으면 맨 위부터 닫기
  if (_overlays.length) { const h = _overlays.pop(); if (h) { try { h(); } catch (e) {} } return; }
  // 베이스(닫을 오버레이 없음)에서 뒤로가기 → 실수 종료 방지(이중 확인)
  if (_backExitArmed) {
    _backExitArmed = false;
    clearTimeout(_backExitTimer);
    try { history.back(); } catch (e) {}   // 한 번 더 → 실제 종료(이전 화면으로)
    return;
  }
  _backExitArmed = true;
  toast('뒤로가기를 한 번 더 누르면 종료됩니다.');
  try { history.pushState(null, ''); } catch (e) {}   // 가드 재삽입 → 이번 뒤로가기 무효화
  clearTimeout(_backExitTimer);
  _backExitTimer = setTimeout(() => { _backExitArmed = false; }, 2000);
});

// ===== 유틸 =====
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
// 일부 삼성 갤럭시 키보드는 한글을 분해형(NFD, 자음·모음 분리)으로 입력한다.
// 그대로 두면 화면에서 자모가 갈라져 보이고, 완성형(NFC)으로 저장된 회원/게임
// 이름과 정확히 일치하지 않아 매칭이 실패한다. 저장·비교 전 NFC로 정규화한다.
function nfc(s) {
  return String(s == null ? '' : s).normalize('NFC');
}
// 플레이타임 표시: 최소~최대(분). 한쪽만 있으면 그 값만. (레거시 playtime_min은 최대로 폴백)
function playtimeText(g) {
  const mn = g.min_playtime;
  const mx = (g.max_playtime != null && g.max_playtime !== '') ? g.max_playtime : g.playtime_min;
  const hasMn = mn != null && mn !== '';
  const hasMx = mx != null && mx !== '';
  if (hasMn && hasMx && String(mn) !== String(mx)) return `${mn}~${mx}분`;
  const one = hasMx ? mx : (hasMn ? mn : null);
  return one != null ? `${one}분` : '';
}
function fmtDate(d) {
  if (!d) return '';
  const s = String(d).substring(0, 10);
  const parts = s.split('-');
  if (parts.length === 3) return `${parts[1]}.${parts[2]}`;
  return s;
}
function thumb(url, cls) {
  // referrerpolicy=no-referrer: BGG 이미지 CDN의 핫링크 차단(403) 회피용.
  // 로드 실패 시 img를 제거하면 뒤의 🎲 플레이스홀더가 그대로 보임.
  const img = url
    ? `<img src="${esc(url)}" loading="lazy" referrerpolicy="no-referrer" alt="" onerror="this.remove()"/>`
    : '';
  return `<div class="thumb ${cls}">${img}</div>`;
}

function switchView(name) {

//  VIEW: 후기 (채팅형) — 모든 게임 후기 최신순, 10개씩 무한 스크롤
// ============================================================
let _rvObserver = null;
async function renderReviews() {
  const list = document.getElementById('reviews-list');
  if (!list) return;
  list.innerHTML = `<div class="muted" style="text-align:center;padding:24px 0;font-size:13px;">불러오는 중…</div>`;

  }

// 후기 날짜 → 'M.D.' (예: 2026-07-24 → 7.24.)
function fmtChatDate(s) {
  const d = String(s || '').substring(0, 10).split('-');
  if (d.length !== 3 || !d[0]) return '';
  return `${Number(d[1])}.${Number(d[2])}.`;
}
// 후기 1건 → 채팅 말풍선(내 후기는 오른쪽, 남의 후기는 왼쪽)
function rvMsgHtml(r) {
  const mine = state.user && String(r.player_id) === String(state.user.player_id);
  const gid = esc(String(r.game_id || ''));
  const head = mine
    ? esc(r.game_name || '')
    : `${esc(r.game_name || '')} · ${esc(r.player_name || '익명')}`;
  const avatar = mine ? ''
    : `<div onclick="showGameInfo('${gid}')" style="flex:0 0 auto;">${thumb(r.game_image, 'rvm-av')}</div>`;
  return `<div class="rvm ${mine ? 'mine' : ''}">
    ${avatar}
    <div class="rvm-body">
      <div class="rvm-head">${head}</div>
      <div class="rvm-bubble-row">
        <div class="rvm-bubble" onclick="showGameInfo('${gid}')">${esc(r.review || '')}</div>
        <span class="rvm-date">${fmtChatDate(r.updated_at)}</span>
      </div>
    </div>
  </div>`;
}
function renderReviewChunk(reset) {
  const list = document.getElementById('reviews-list');
  if (!list) return;
  const all = state._allReviews || [];
  if (reset) { list.innerHTML = ''; state._rvShown = 0; }
  if (!all.length) {
    list.innerHTML = `<div class="empty"><div class="big">💬</div>아직 후기가 없어요.<br/>게임 상세에서 후기를 남겨보세요.</div>`;
    return;
  }
  const from = state._rvShown || 0, to = Math.min(from + 10, all.length);
  const old = document.getElementById('rv-sentinel'); if (old) old.remove();
  list.insertAdjacentHTML('beforeend', all.slice(from, to).map(rvMsgHtml).join(''));
  state._rvShown = to;
  if (_rvObserver) { _rvObserver.disconnect(); _rvObserver = null; }
  if (to < all.length) {
    list.insertAdjacentHTML('beforeend', '<div id="rv-sentinel" style="height:1px;"></div>');
    _rvObserver = new IntersectionObserver(entries => {
      if (entries.some(e => e.isIntersecting)) renderReviewChunk(false);
    }, { rootMargin: '300px' });
    _rvObserver.observe(document.getElementById('rv-sentinel'));
  }
}

// ===== 후기 바로 쓰기(중앙 팝업): 최근 플레이 게임 선택 → 별점·후기 작성 =====
function recentlyPlayedGames() {
  const seen = new Set(); const firstIdx = {};
  (state.plays || []).forEach((s, i) => {
    if (s.participants.some(p => p.player_id === (state.user && state.user.player_id))) {
      if (!seen.has(s.game_id)) { seen.add(s.game_id); firstIdx[s.game_id] = i; }
    }
  });
  return (state.games || []).filter(g => seen.has(g.game_id))
    .sort((a, b) => firstIdx[a.game_id] - firstIdx[b.game_id]);
}
async function openReviewWrite() {

function renderReviewWrite() {

        ${thumb(g.image_url, 'rvw-thumb')}

      </button>`;
    }).join('') : `<div class="muted" style="font-size:13px;text-align:center;padding:20px 0;">최근 플레이한 게임이 없어요.<br/>플레이 결과를 먼저 추가해 주세요.</div>`;
    body.innerHTML = `

      </div>
      <div style="display:flex;gap:10px;align-items:center;margin-bottom:14px;">
        ${thumb(g.image_url, 'rvw-thumb-lg')}
        <div style="font-weight:800;font-size:15px;min-width:0;">${esc(g.name_kr || g.name_en)}</div>
      </div>
      ${ratingEditorHtml(g)}`;
  }
}

async function loadCore(manual) {
  showLoader(manual ? '업데이트 중…' : '데이터 불러오는 중…');
  try {
    // getCategories는 옛 백엔드엔 없을 수 있으므로 실패해도 기본값 유지
    const [games, plays, players, categories] = await Promise.all([
      api('getGames'), api('getPlays'), api('getPlayers'),
      api('getCategories').catch(() => null)
    ]);
    state.games = games;
    state.plays = plays;
    state.players = players;
    if (Array.isArray(categories) && categories.length) CATEGORIES = categories;
    // 개인 통계/평점 캐시 무효화 → 다음 렌더 시 새로 로드
    state._myStats = null;
    state._myRatings = null;
    state._myRatingsPromise = null;
    renderPlay();
    renderGames();
    if (state.user && document.getElementById('view-my').classList.contains('active')) renderMy();
    if (!manual) restoreView();   // 최초 로드(=새로고침): 마지막으로 보던 탭 복원
    if (manual) toast('최신 데이터로 업데이트했어요.');
  } catch (e) {
    toast('연결 실패: ' + e.message, true);
  } finally {
    hideLoader();
  }
}

// 🔄 수동 업데이트 버튼용
function refreshAll() { loadCore(true); }

// 새로고침(전체 페이지 리로드) 후 마지막으로 보던 탭으로 복원.
// 기본 활성 탭이 'games'이므로 그 외일 때만 전환.
function restoreView() {
  let v = null;
  try { v = localStorage.getItem('bg_view'); } catch (e) {}
  if (v && v !== 'games' && ['play', 'games', 'reviews', 'my'].includes(v)) switchView(v);
}

// ============================================================
//  VIEW: 플레이
// ============================================================
function setPlayScope(scope) {
  state.playScope = scope;
  renderPlay();
}

function renderPlay() {
  const nowYM = new Date().toISOString().substring(0, 7);
  const scope = state.playScope || 'month';

  // game_id -> category 맵
  const catOf = {};
  state.games.forEach(g => { catOf[g.game_id] = g.category || '기타'; });

  // 게임별 + 카테고리별 플레이 횟수 집계(전체/이번 달)
  const agg = {};       // gid -> {id, name, image, all, month}
  const catAgg = {};    // category -> {all, month}
  let totalMonth = 0;
  state.plays.forEach(s => {
    const isMonth = String(s.play_date).substring(0, 7) === nowYM;
    if (isMonth) totalMonth++;
    const gid = s.game_id || s.game_name;
    if (!agg[gid]) agg[gid] = { id: s.game_id, name: s.game_name, image: s.game_image, all: 0, month: 0 };
    agg[gid].all++;
    if (isMonth) agg[gid].month++;
    const cat = catOf[s.game_id] || '기타';
    if (!catAgg[cat]) catAgg[cat] = { all: 0, month: 0 };
    catAgg[cat].all++;
    if (isMonth) catAgg[cat].month++;
  });
  const totalAll = state.plays.length;

  // 최고 평점 = 우리Hub 평점(club_rating)이 가장 높은 게임(평가 있는 게임 중, 동점이면 평가 수 많은 순)
  let topGame = '-', topRating = -1, topCnt = -1, topId = '';
  state.games.forEach(g => {
    if (g.club_rating == null) return;
    const r = Number(g.club_rating), c = Number(g.rating_count || 0);
    if (r > topRating || (r === topRating && c > topCnt)) {
      topRating = r; topCnt = c; topGame = g.name_kr || g.name_en || g.game_id; topId = g.game_id;
    }
  });
  const topClick = topId ? `style="cursor:pointer;" onclick="showGameInfo('${topId}')"` : '';

  // 1) 누적 카드를 맨 왼쪽에
  document.getElementById('play-summary').innerHTML = `
    <div class="stat ${scope === 'all' ? 'hero' : ''}" style="cursor:pointer;" onclick="setPlayScope('all')">
      <div class="num">${totalAll}</div><div class="lbl">누적 플레이</div></div>
    <div class="stat ${scope === 'month' ? 'hero' : ''}" style="cursor:pointer;" onclick="setPlayScope('month')">
      <div class="num">${totalMonth}</div><div class="lbl">이번 달 플레이</div></div>
    <div class="stat" ${topClick}><div class="num" id="play-top-rated" style="font-size:14px;padding-top:6px;max-width:100%;">${esc(topGame)}</div><div class="lbl">최고 평점</div></div>`;
  fitText(document.getElementById('play-top-rated'), 14, 9);

  // 3) 카테고리별 플레이 횟수 세로 막대그래프(선택 범위 반영)
  const catList = Object.keys(catAgg)
    .map(c => ({ cat: c, count: scope === 'month' ? catAgg[c].month : catAgg[c].all }))
    .filter(c => c.count > 0)
    .sort((a, b) => b.count - a.count);
  const catEl = document.getElementById('play-catchart');
  if (catList.length) {
    // 모든 분류를 각각 가로 막대로 표시
    const maxRow = Math.max(...catList.map(c => c.count));
    catEl.innerHTML = `<div class="card">
      <div class="section-title" style="margin-top:0;">카테고리별 플레이 횟수 ${scope === 'month' ? '(이번 달)' : '(누적)'}</div>
      <div class="hbarchart">${catList.map(c => {
        const pct = Math.max(4, Math.round(c.count / maxRow * 100));
        return `<div class="hbar-row">
          <span class="hbar-name">${esc(c.cat)}</span>
          <span class="hbar-track"><i style="width:${pct}%;"></i></span>
          <span class="hbar-val">${c.count}</span>
        </div>`;
      }).join('')}</div>
    </div>`;
  } else {
    catEl.innerHTML = '';
  }

  document.getElementById('play-list-title').textContent =
    scope === 'month' ? '이번 달 게임별 플레이 횟수' : '게임별 플레이 횟수';

  // 게임별 순위(선택 범위 기준, 횟수 내림차순). 평점은 매 렌더 시 state.games에서 조회 → 새 게임에도 자동 반영
  const list = Object.keys(agg)
    .map(gid => {
      const gm = gameById(agg[gid].id) || {};
      return {
        id: agg[gid].id, name: agg[gid].name, image: agg[gid].image,
        count: scope === 'month' ? agg[gid].month : agg[gid].all,
        club_rating: gm.club_rating, rating_count: gm.rating_count, review_count: gm.review_count
      };
    })
    .filter(g => g.count > 0)
    .sort((a, b) => b.count - a.count || String(a.name).localeCompare(String(b.name)));

  const el = document.getElementById('play-list');
  if (!list.length) {
    el.innerHTML = `<div class="empty"><div class="big">🎲</div>${scope === 'month' ? '이번 달 플레이 기록이 없어요.' : '아직 플레이 기록이 없어요.'}<br/>+ 버튼으로 결과를 추가해보세요.</div>`;
    return;
  }
  const ranks = competitionRanks(list, g => g.count);   // 동일 판수 = 공동 순위
  el.innerHTML = list.map((g, i) => `
    <div class="session" style="display:flex;align-items:center;gap:12px;position:relative;${g.id ? 'cursor:pointer;' : ''}" ${g.id ? `onclick="showGameInfo('${g.id}')"` : ''}>
      ${g.id ? `<div class="gcard-actions br">${reviewPillHtml(g.id, g.review_count)}</div>` : ''}
      <div class="grow-rank">${ranks[i]}</div>
      ${thumb(g.image, 'session-thumb')}
      <div style="flex:1;min-width:0;">
        <div class="g-name" style="font-weight:700;">${esc(g.name)}</div>
        <div class="g-meta">${g.count}판 · ${clubRatingMini(g.club_rating, g.rating_count)}</div>
      </div>
    </div>`).join('');
}

// 동점 공동 순위: 정렬된 배열에서 기준값이 같으면 같은 순위(1,2,2,2,5 방식)
function competitionRanks(list, keyFn) {
  const ranks = [];
  list.forEach((item, i) => {
    ranks.push(i > 0 && keyFn(item) === keyFn(list[i - 1]) ? ranks[i - 1] : i + 1);
  });
  return ranks;
}

// 칸 너비에 맞게 글씨 크기를 줄임(한 줄 유지, 넘치면 min까지 축소)
function fitText(el, max, min) {
  if (!el) return;
  el.style.whiteSpace = 'nowrap';
  el.style.overflow = 'hidden';
  el.style.textOverflow = 'ellipsis';
  requestAnimationFrame(() => {
    const avail = el.clientWidth;
    if (avail <= 0) return;
    let fs = max;
    el.style.fontSize = fs + 'px';
    while (el.scrollWidth > avail && fs > min) { fs -= 0.5; el.style.fontSize = fs + 'px'; }
  });
}

// 게임 카드처럼 컴팩트한 평점 표시(★ 8.5 (3) / 평가없음)
function clubRatingMini(rating, count) {
  return (rating != null)
    ? `<span style="color:var(--win);">★</span> <b style="color:var(--main);">${Number(rating).toFixed(1)}</b> <small class="muted">(${count || 0})</small>`
    : `<span class="muted">★ 평가없음</span>`;
}

  if (g.weight) meta.push(`🧠 ${Number(g.weight).toFixed(2)}`);

  const club = g.club_rating != null
    ? `<span class="rate-club"><span class="star">★</span> ${g.club_rating.toFixed(1)}</span> <small class="muted">우리Hub평점 (평가 ${g.rating_count || 0})</small>`
    : `<span class="muted">우리Hub평점 없음</span>`;

  return `
    <div style="display:flex;gap:12px;align-items:center;margin-bottom:12px;">

      </div>
    </div>

// MY-게임기록 펼침: 게임 기본 정보 + 일자별 플레이 요약(일자·승패·내점수·최고점수)
function myGameDetailHtml(g) {
  const uid = state.user ? state.user.player_id : null;
  const mine = state.plays
    .filter(s => s.game_id === g.game_id && s.participants.some(p => p.player_id === uid))
    .slice()
    .sort((a, b) => String(b.play_date).localeCompare(String(a.play_date)));

  let rows;
  if (!mine.length) {
    rows = `<div class="muted" style="font-size:12px;padding:6px 2px;">플레이 기록이 없어요.</div>`;
  } else {
    rows = mine.map(s => {
      const me = s.participants.find(p => p.player_id === uid) || {};
      const scores = s.participants
        .map(p => p.score == null || p.score === '' ? null : Number(p.score))
        .filter(v => v != null && !isNaN(v));
      const top = scores.length ? Math.max(...scores) : null;
      const myScore = (me.score == null || me.score === '') ? null : me.score;
      const win = me.is_win;
      return `<div class="pdate-row" onclick="showSessionDetail('${esc(s.session_id)}')">
        <span class="pdate-d">${esc(String(s.play_date).substring(0, 10))}</span>
        <span class="pdate-wl ${win ? 'win' : 'loss'}">${win ? '승 👑' : '패 🥈'}</span>
        <span class="pdate-s">나 ${myScore == null ? '-' : esc(myScore) + '점'}</span>
        <span class="pdate-s muted">최고 ${top == null ? '-' : top + '점'}</span>
        <span class="pdate-arrow">›</span>
      </div>`;
    }).join('');
  }

  // 헤더(게임 정보 + 요약 제목)는 상단 고정, 아래 일자별 리스트만 스크롤
  return `<div class="mgstat-head">
      <div class="gcard-top" style="position:relative;">
        ${gameCardTopHtml(g, true)}
        <button class="gcard-detail-btn" onclick="openGameDetail('${g.game_id}')">상세</button>
      </div>
      <div class="pdate-head">📅 일자별 플레이 요약</div>

}

// ============================================================
//  게임 상세 페이지 (MY-게임기록 카드 → 게임명 탭)
// ============================================================
// 이 게임을 함께 플레이한 플레이어별 통계(나 포함, 게스트 포함)
function gamePlayerStats(gid) {
  const uid = state.user ? state.user.player_id : null;
  const map = new Map();
  state.plays.forEach(s => {
    if (s.game_id !== gid) return;
    // '함께 플레이한 기록': 내가 참가한 세션만 집계 → 같이 한 사람의
    // 통계도 나와 함께한 판만으로 계산됨
    if (uid && !s.participants.some(p => p.player_id === uid)) return;
    s.participants.forEach(p => {
      const key = p.player_id ? ('m:' + p.player_id) : ('g:' + (p.name || ''));
      let r = map.get(key);
      if (!r) { r = { name: p.name || '(이름없음)', wins: 0, games: 0, scores: [], isMe: p.player_id && p.player_id === uid }; map.set(key, r); }
      r.games += 1;
      if (p.is_win) r.wins += 1;
      const sc = (p.score == null || p.score === '') ? null : Number(p.score);
      if (sc != null && !isNaN(sc)) r.scores.push(sc);
    });
  });
  return Array.from(map.values()).map(r => ({
    name: r.name, isMe: r.isMe, wins: r.wins, games: r.games,
    winrate: r.games ? Math.round(r.wins / r.games * 1000) / 10 : 0,
    avg: r.scores.length ? Math.round(r.scores.reduce((a, b) => a + b, 0) / r.scores.length * 10) / 10 : null,
    best: r.scores.length ? Math.max(...r.scores) : null
  }));
}

// 추이선: 점들을 직선으로 연결한 path 생성
function smoothPath(pts) {
  if (!pts.length) return '';
  if (pts.length === 1) { const p = pts[0]; return `M${(p.x - 0.1).toFixed(1)},${p.y.toFixed(1)} L${(p.x + 0.1).toFixed(1)},${p.y.toFixed(1)}`; }
  return `M${pts[0].x.toFixed(1)},${pts[0].y.toFixed(1)}` +
    pts.slice(1).map(p => ` L${p.x.toFixed(1)},${p.y.toFixed(1)}`).join('');
}

// 상단만 둥근 막대 path
function topRoundRect(x, yy, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h));
  return `M${x.toFixed(1)},${(yy + h).toFixed(1)} L${x.toFixed(1)},${(yy + r).toFixed(1)} Q${x.toFixed(1)},${yy.toFixed(1)} ${(x + r).toFixed(1)},${yy.toFixed(1)} L${(x + w - r).toFixed(1)},${yy.toFixed(1)} Q${(x + w).toFixed(1)},${yy.toFixed(1)} ${(x + w).toFixed(1)},${(yy + r).toFixed(1)} L${(x + w).toFixed(1)},${(yy + h).toFixed(1)} Z`;
}

function gameChartSvg(sessions, uid) {
  const pts = sessions.map(s => {
    const scores = s.participants.map(p => (p.score == null || p.score === '') ? null : Number(p.score)).filter(v => v != null && !isNaN(v));
    const me = s.participants.find(p => p.player_id === uid) || {};
    const mine = (me.score == null || me.score === '') ? null : Number(me.score);
    return { date: String(s.play_date).substring(5, 10), best: scores.length ? Math.max(...scores) : null, mine, sid: s.session_id };
  });
  if (!pts.length) return `<div class="muted" style="font-size:12px;padding:10px 2px;text-align:center;">점수 기록이 없어요.</div>`;
  const W = 340, H = 116, padT = 24, padB = 20, padX = 8;
  const plotH = H - padT - padB, baseY = padT + plotH;
  const n = pts.length, slot = (W - padX * 2) / n;
  const maxV = Math.max(1, ...pts.map(p => Math.max(p.best || 0, p.mine || 0)));
  const y = v => padT + plotH * (1 - v / maxV);
  const cx = i => padX + slot * (i + 0.5);
  const bw = Math.min(slot * 0.56, 26);
  let bars = '', labels = '';
  const line = [];
  pts.forEach((p, i) => {
    const x = cx(i);
    if (p.best != null) {
      const by = y(p.best);
      bars += `<path d="${topRoundRect(x - bw / 2, by, bw, baseY - by, 5)}" fill="var(--main)" style="cursor:pointer;" onclick="showBarSession('${esc(p.sid)}')"/>`;
      labels += `<text x="${x.toFixed(1)}" y="${(by - 8).toFixed(1)}" text-anchor="middle" font-size="9.5" fill="#8a86a8" style="pointer-events:none;">${p.best}</text>`;
    }
    if (p.mine != null) {
      const my = y(p.mine);
      line.push({ x, y: my });
      labels += `<text x="${x.toFixed(1)}" y="${(my + 13).toFixed(1)}" text-anchor="middle" font-size="9.5" font-weight="700" fill="#d9d5f3" style="pointer-events:none;">${p.mine}</text>`;
    }
    labels += `<text x="${x.toFixed(1)}" y="${(H - 5).toFixed(1)}" text-anchor="middle" font-size="9" fill="#9a97a8" style="pointer-events:none;">${p.date}</text>`;
  });
  const curve = smoothPath(line);
  const path = curve ? `<path d="${curve}" fill="none" stroke="#d9d5f3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="pointer-events:none;"/>` : '';
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;">${bars}${path}${labels}</svg>`;
}

// 게임 탭: [후기] 버튼 → 사람들이 남긴 후기(닉네임 + 코멘트)
async function openReviews(gameId) {
  const g = gameById(gameId);
  const title = g ? esc(g.name_kr || g.name_en) : '';
  const head = `<h2 style="font-size:20px;font-weight:900;margin:2px 2px 12px;">💬<span class="muted" style="font-size:13px;font-weight:500;">· ${title}</span></h2>`;
  const body = document.getElementById('detail-body');
  body.innerHTML = head + `<div class="empty"><div class="spinner" style="margin:0 auto;"></div></div>`;

      ? reviews.map(r => `<div class="rv-row">
          <div class="rv-name">${esc(r.name)}<span class="rv-when">${esc(String(r.updated_at || '').substring(0, 10))}</span></div>
          <div class="rv-text">${esc(r.review)}</div>
        </div>`).join('')

function sortGameDetail(col) {
  const gd = state._gd; if (!gd) return;
  if (gd.col === col) gd.dir = gd.dir === 'desc' ? 'asc' : 'desc';
  else { gd.col = col; gd.dir = col === 'name' ? 'asc' : 'desc'; }
  renderGameDetail();
}

function renderGameDetail() {
  const gd = state._gd; if (!gd) return;
  const g = gameById(gd.gid);
  if (!g) { toast('게임 정보를 찾을 수 없습니다.', true); return; }
  const uid = state.user ? state.user.player_id : null;

  // 1) 상단: 사진 + 내 통계(판수·승수·평균·최고)
  let myGames = 0, myWins = 0; const myScores = [];
  state.plays.forEach(s => {
    if (s.game_id !== gd.gid) return;
    const me = s.participants.find(p => p.player_id === uid);
    if (me) {
      myGames++; if (me.is_win) myWins++;
      const sc = (me.score == null || me.score === '') ? null : Number(me.score);
      if (sc != null && !isNaN(sc)) myScores.push(sc);
    }
  });
  const myAvg = myScores.length ? Math.round(myScores.reduce((a, b) => a + b, 0) / myScores.length * 10) / 10 : null;
  const myBest = myScores.length ? Math.max(...myScores) : null;
  const scoreTxt = myScores.length ? `평균 ${myAvg}점 · 최고 ${myBest}점` : '점수 없음';
  const top = `<div class="gd-top">
    ${thumb(g.image_url, 'gcard-img')}
    <div style="flex:1;min-width:0;">
      <div class="gcard-name">${esc(g.name_kr || g.name_en)}
        ${g.category ? `<span class="badge" style="margin-left:6px;">${esc(g.category)}</span>` : ''}</div>
      <div class="gd-mystat">${myGames}판 · ${myWins}승 · ${scoreTxt}</div>
    </div>
  </div>`;

  // 2) 최근 6판 차트(내가 참가한 세션)
  const mine = state.plays
    .filter(s => s.game_id === gd.gid && s.participants.some(p => p.player_id === uid))
    .sort((a, b) => String(a.play_date).localeCompare(String(b.play_date)));
  const recent = mine.slice(-10);
  const chart = `<div class="gd-sec">
    <div class="gd-sec-title" style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;">
      <span>📈 최근 ${recent.length}판 점수 추이</span>
      <span class="gd-legend" style="margin-top:0;gap:10px;"><span><i style="background:var(--main);"></i>최고 점수</span><span><i style="background:#d9d5f3;"></i>내 점수</span></span>
    </div>
    <div class="gd-chart">${gameChartSvg(recent, uid)}</div>
  </div>`;

  // 3) 플레이어 통계 표(정렬 가능)
  const players = gamePlayerStats(gd.gid);
  const dir = gd.dir === 'asc' ? 1 : -1;
  players.sort((a, b) => {
    if (gd.col === 'name') return a.name.localeCompare(b.name) * dir;
    const av = a[gd.col], bv = b[gd.col];
    const an = av == null, bn = bv == null;
    if (an && bn) return 0; if (an) return 1; if (bn) return -1;  // 값 없으면 항상 아래
    return (av - bv) * dir;
  });
  const arrow = c => gd.col === c ? (gd.dir === 'asc' ? ' ▲' : ' ▼') : '';
  const th = (c, label) => `<th class="${gd.col === c ? 'act' : ''}" onclick="sortGameDetail('${c}')">${label}${arrow(c)}</th>`;
  const rows = players.map(p => `<tr class="${p.isMe ? 'me' : ''}">
    <td>${esc(p.name)}${p.isMe ? ' <span style="color:var(--main);font-size:10px;">나</span>' : ''}</td>
    <td>${p.wins}</td><td>${p.winrate}%</td><td>${p.games}</td>
    <td>${p.avg == null ? '-' : p.avg}</td><td>${p.best == null ? '-' : p.best}</td>
  </tr>`).join('');
  const table = `<div class="gd-sec">
    <div class="gd-sec-title">👥 함께 플레이한 기록 (${players.length}명)</div>
    <div class="gd-table-wrap"><table class="gd-table">
      <thead><tr>${th('name', '플레이어')}${th('wins', '승수')}${th('winrate', '승률')}${th('games', '게임수')}${th('avg', '평균')}${th('best', '최고')}</tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
  </div>`;

  document.getElementById('gd-body').innerHTML = top + chart + table;
  const page = document.getElementById('gd-page');
  page.classList.add('show');
  page.scrollTop = 0;
}

      </div>`).join('');
    // linkGame: 카드(수정/작성자 버튼 제외) 클릭 → 그 게임 상세로 이동
    const cardOpen = opts.linkGame
      ? `<div class="session clickable" onclick="openGameDetail('${esc(String(s.game_id))}')">`
      : `<div class="session">`;
    return `${cardOpen}
      <div class="session-head">
        ${thumb(s.game_image, 'session-thumb')}
        <div style="flex:1;min-width:0;">
          <div class="g-name">${esc(s.game_name)}</div>
          <div class="g-meta">${esc(String(s.play_date).substring(0,10))}${dur} · ${s.participants.length}명${creator}</div>
        </div>
        ${canEdit
          ? `<button class="btn ghost sm" style="padding:5px 12px;font-size:12px;flex:0 0 auto;" onclick="event.stopPropagation(); startEditSession('${esc(s.session_id)}')">수정</button>`
          : (s.created_by
              ? `<button class="btn sm author" style="padding:5px 12px;font-size:12px;flex:0 0 auto;" onclick="event.stopPropagation(); authorToast('${esc(String(s.created_by))}')">${esc(playerNameById(s.created_by))}</button>`
              : '')}

    </div>`;
  }).join('');
  if (state._editSid) renderEditParts();   // 수정 중이면 참가자 편집기 채우기

function editToggleGuest(i, checked) { state._editParts[i].is_guest = checked; renderEditParts(); }
function editAddPart() { state._editParts.push({ name: '', score: '', is_win: false, is_guest: false }); renderEditParts(); }

async function saveEditSession(sid) {
  if (!state.user) return;
  const card = document.querySelector(`.session[data-sid="${sid}"]`);
  if (!card) return;
  const play_date = card.querySelector('.edit-date').value;
  const duration_min = card.querySelector('.edit-duration').value;

  // 참가자 정보(이름/게스트↔회원/점수/승패) 전체를 재구성 — 추가 화면과 동일한 검증
  const rawParts = (state._editParts || []).filter(p => nfc(p.name).trim());
  if (!rawParts.length) { toast('참가자를 최소 1명 입력하세요.', true); return; }
  const participants = [];
  const seen = new Set();
  for (const p of rawParts) {
    const nm = nfc(p.name).trim();
    let player_id = '', player_name = nm;
    if (p.is_guest) {
      player_id = ''; player_name = nm;
    } else {
      const pl = playerByExactName(nm);
      if (!pl) { toast(`"${nm}"은(는) 회원 명단에 없어요. 비회원이면 '비회원(게스트)'를 체크하세요.`, true); return; }
      player_id = pl.player_id; player_name = pl.name;
    }
    const key = player_id ? ('m:' + player_id) : ('g:' + player_name);
    if (seen.has(key)) { toast('참가자가 중복되었습니다.', true); return; }
    seen.add(key);
    participants.push({ player_id, player_name, score: p.score, is_win: !!p.is_win });
  }

  const pin = await promptPin();
  if (pin == null) return;
  showLoader('저장 중…');
  try {
    const res = await api('updatePlay', { playerId: state.user.player_id, pin, payload: JSON.stringify({ session_id: sid, play_date, duration_min, participants }) });
    state.plays = await api('getPlays');
    state.games = await api('getGames');
    state._myStats = null;
    state._editSid = null; state._editParts = null;
    refreshSessionsView();
    if (res && res.mode === 'replace') toast('수정되었습니다.');
    else toast('참가자 변경은 DB 업데이트 후 적용돼요 (supabase_migration_editparts.sql 실행 필요).', true);
  } catch (e) {
    toast(e.message, true);
  } finally {
    hideLoader();
  }
}

async function deleteSession(sid) {
  if (!confirm('이 기록을 삭제하면 함께 플레이한 모든 참가자의 기록에서도 사라집니다.\n정말 삭제할까요?')) return;
  const pin = await promptPin();
  if (pin == null) return;
  showLoader('삭제 중…');
  try {
    await api('deletePlay', { playerId: state.user.player_id, pin, sessionId: sid });
    state.plays = await api('getPlays');
    state._myStats = null;
    state._editSid = null;

    refreshSessionsView();
  } catch (e) {
    toast(e.message, true);
  } finally {
    hideLoader();
  }
}

// 난이도(weight) 필터 구간
const WEIGHT_BUCKETS = [
  { key: '0-2', label: '0~2', lo: 0, hi: 2 },
  { key: '2-3', label: '2~3', lo: 2, hi: 3 },
  { key: '3-4', label: '3~4', lo: 3, hi: 4 },
  { key: '4-5', label: '4~5', lo: 4, hi: 5 }
];

function renderCategoryFilter() {

}
function setCatFilter(c) { state.gameFilter.category = c; renderGames(); centerSelectedChip('cat-filter'); }

function renderPlayerCountFilter() {

    WEIGHT_BUCKETS.map(b => `<span class="chip ${cur === b.key ? 'on' : ''}" onclick="setWeightFilter('${b.key}')">${b.label}</span>`).join('');
}
function setWeightFilter(key) { state.gameFilter.weight = key; renderGames(); centerSelectedChip('weight-filter'); }

document.getElementById('game-search').addEventListener('input', e => {
  state.gameFilter.search = e.target.value.trim().toLowerCase();
  renderGameCards();
});

function filteredGames() {
  const f = state.gameFilter;
  let list = state.games.slice();
  if (f.category) list = list.filter(g => g.category === f.category);
  if (f.playerCount) {
    const n = f.playerCount;
    list = list.filter(g => {
      const min = g.min_players, max = g.max_players;
      if (min == null && max == null) return false;
      const lo = min == null ? 1 : min;
      const hi = max == null ? 99 : max;
      return lo <= n && n <= hi;
    });
  }
  if (f.weight) {
    const b = WEIGHT_BUCKETS.find(x => x.key === f.weight);
    if (b) list = list.filter(g => {
      const w = g.weight;
      if (w == null) return false;
      // 경계값은 위 구간에 포함(2→2~3, 3→3~4, 4→4~5), 마지막 구간만 상한 포함
      return b.key === '4-5' ? (w >= b.lo && w <= b.hi) : (w >= b.lo && w < b.hi);
    });
  }
  if (f.search) {
    list = list.filter(g =>
      (g.name_kr || '').toLowerCase().includes(f.search) ||
      (g.name_en || '').toLowerCase().includes(f.search));
  }
  // 기본 정렬: 최근 추가된 게임(게임번호 큰 순)이 위로
  const gidNum = g => parseInt(String(g.game_id).replace(/\D/g, ''), 10) || 0;
  list.sort((a, b) => gidNum(b) - gidNum(a));
  return list;
}

// 게임 카드 헤더(사진 옆 정보 정렬): 이름·분류·메타·Hub평점(+내 평점)
// showMine=true 이면 Hub 평점 옆에 '나 ★ X.X' 표시(게임 기록 카드와 동일)
function gameCardTopHtml(g, showMine) {
  const meta = [];
  if (g.min_players || g.max_players) {
    const mn = g.min_players || '?', mx = g.max_players || '?';
    meta.push(`👥 ${mn}${mx !== mn ? '~' + mx : ''}명`);
  }
  { const _pt = playtimeText(g); if (_pt) meta.push(`⏱ ${_pt}`); }
  if (g.weight) meta.push(`🧠 ${Number(g.weight).toFixed(2)}`);

  const club = g.club_rating != null
    ? `<span class="rate-club"><span class="star">★</span> ${g.club_rating.toFixed(1)} <small>(${g.rating_count})</small></span>`
    : `<span class="rate-club muted"><span class="star" style="color:#dcdce3">★</span> - <small>평가없음</small></span>`;

  let mine = '';
  if (showMine) {
    const r = (state._myRatings && state._myRatings[g.game_id]) ? state._myRatings[g.game_id].rating : null;
    mine = (r != null)
      ? `<span class="rate-mine">나 <span class="star">★</span> ${Number(r).toFixed(1)}</span>`
      : `<span style="font-size:12px;color:var(--text-sub);">내 평점 없음</span>`;
  }

  return `${thumb(g.image_url, 'gcard-img')}
      <div class="gcard-body">
        <div class="gcard-name">${esc(g.name_kr || g.name_en)}
          ${g.category ? `<span class="badge" style="margin-left:6px;">${esc(g.category)}</span>` : ''}</div>
        ${g.name_en && g.name_kr ? `<div class="gcard-en">${esc(g.name_en)}</div>` : ''}
        <div class="gcard-meta">${meta.map(m => `<span>${m}</span>`).join('')}</div>
        <div class="gcard-ratings">${club}${mine}</div>
      </div>`;
}

function gameCardHtml(g, opts = {}) {
  // 펼침 영역: 내 게임기록은 '평점 에디터', 그 외는 '게임 요약'
  const detail = opts.ratingEditor
    ? `<div class="gcard-editwrap">${ratingEditorHtml(g)}</div>`
    : (g.summary_kr
        ? `<div class="gcard-detail">${esc(g.summary_kr)}</div>`
        : `<div class="gcard-detail muted">등록된 요약이 없습니다.</div>`);

  const acts = [];
  // 관리자 또는 이 게임을 등록한 본인이면 우측 상단 연필(수정 팝업)
  const canEditGame = state.user && (state.user.role === 'admin' ||
    (g.created_by && String(g.created_by) === String(state.user.player_id)));
  if (opts.adminEdit || canEditGame) acts.push(`<button class="gcard-pill edit" title="게임 정보 수정" onclick="event.stopPropagation(); openEditGame('${g.game_id}')">✏️</button>`);
  const actsHtml = acts.length ? `<div class="gcard-actions">${acts.join('')}</div>` : '';
  // 상세·후기 버튼은 평점 줄 오른쪽 끝(우측 하단)에 배치
  const br = [];
  if (opts.ratingEditor) br.push(`<button class="gcard-pill" onclick="event.stopPropagation(); openGameDetail('${g.game_id}')">상세</button>`);
  if (opts.review) br.push(reviewPillHtml(g.game_id, g.review_count));
  const reviewHtml = br.length ? `<div class="gcard-actions br">${br.join('')}</div>` : '';

  return `<div class="gcard" data-gid="${g.game_id}">
    ${actsHtml}
    <div class="gcard-top" onclick="toggleCard(this)">
      ${gameCardTopHtml(g, opts.ratingEditor)}
      ${reviewHtml}
    </div>
    ${detail}
  </div>`;
}

function toggleCard(topEl) {
  topEl.parentElement.classList.toggle('open');
}

// ===== 평점 정렬 토글 (없음 → 내림차순 → 오름차순 → 없음) =====
function nextSortMode(cur) { return cur === 'desc' ? 'asc' : cur === 'asc' ? null : 'desc'; }
function sortBtnLabel(mode) { return mode === 'desc' ? '평점↓' : mode === 'asc' ? '평점↑' : '평점'; }
// 평점 없는 게임: 내림차순이면 맨 아래, 오름차순(낮은 평점부터)이면 맨 위.
// 해제(null)면 원본 순서 그대로.
function applyRatingSort(list, mode, getRating) {
  if (!mode) return list;
  return list.slice().sort((a, b) => {
    const av = getRating(a), bv = getRating(b);
    const an = av == null, bn = bv == null;
    if (an && bn) return 0;
    if (an) return mode === 'asc' ? -1 : 1;
    if (bn) return mode === 'asc' ? 1 : -1;
    return mode === 'asc' ? av - bv : bv - av;
  });
}

function cycleGameSort() {
  state.gameSortRating = nextSortMode(state.gameSortRating);
  const b = document.getElementById('game-sort-btn');
  b.textContent = sortBtnLabel(state.gameSortRating);
  b.classList.toggle('on', !!state.gameSortRating);
  renderGameCards();
}

function renderGameCards() {
  const list = applyRatingSort(filteredGames(), state.gameSortRating,
    g => g.club_rating == null ? null : Number(g.club_rating));
  const el = document.getElementById('games-list');
  if (!list.length) {
    el.innerHTML = `<div class="empty"><div class="big">🎯</div>조건에 맞는 게임이 없어요.</div>`;
    return;
  }
  // 게임 수정은 관리자 페이지에서만 — 통합 게임탭은 모두 동일 UI
  el.innerHTML = list.map(g => gameCardHtml(g, { review: true })).join('');
}
